<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Konno - Optimized Space</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: #1a1a1a;
                overflow: hidden;
                font-family: "Courier New", Courier, monospace;
                user-select: none;
            }
            #game-container {
                position: relative;
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
                border: 2px solid #333;
            }
            canvas {
                display: block;
                background: #0a0a0a;
                cursor: crosshair;
            }

            /* === START SCREEN MENU === */
            #start-screen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(10, 10, 10, 0.95);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 100;
                backdrop-filter: blur(5px);
                transition: opacity 0.3s;
            }
            .menu-content {
                background: rgba(30, 30, 30, 0.9);
                border: 2px solid #ffd700;
                padding: 40px;
                border-radius: 10px;
                text-align: center;
                box-shadow: 0 0 20px #ffd700;
                max-width: 500px;
                width: 100%;
            }
            h1 {
                color: #ffd700;
                margin-bottom: 30px;
                text-transform: uppercase;
                letter-spacing: 5px;
                font-size: 32px;
                text-shadow: 0 0 10px #ffd700;
            }
            .menu-input {
                background: #111;
                border: 1px solid #555;
                color: #fff;
                padding: 10px;
                font-size: 18px;
                font-family: "Courier New", Courier, monospace;
                width: 80%;
                margin-bottom: 20px;
                text-align: center;
                outline: none;
            }
            .menu-input:focus {
                border-color: #ffd700;
                box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
            }
            .menu-btn {
                background: #222;
                border: 1px solid #00ffff;
                color: #00ffff;
                padding: 15px 30px;
                font-size: 18px;
                font-family: "Courier New", Courier, monospace;
                cursor: pointer;
                margin: 10px;
                text-transform: uppercase;
                transition: all 0.2s;
                width: 80%;
                font-weight: bold;
            }
            .menu-btn:hover {
                background: #00ffff;
                color: #000;
                box-shadow: 0 0 15px #00ffff;
            }
            .menu-btn.save {
                border-color: #ffd700;
                color: #ffd700;
            }
            .menu-btn.save:hover {
                background: #ffd700;
                color: #000;
                box-shadow: 0 0 15px #ffd700;
            }

            #message-overlay {
                position: absolute;
                top: 20%;
                left: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
                text-align: center;
                opacity: 0;
                transition: opacity 0.5s;
                z-index: 50;
            }
            .toast {
                background: rgba(0, 0, 0, 0.9);
                border: 2px solid #00ffff;
                color: #00ffff;
                padding: 15px 30px;
                font-size: 24px;
                border-radius: 4px;
                text-transform: uppercase;
                letter-spacing: 3px;
                font-weight: bold;
            }
            .toast.gold {
                border-color: #ffd700;
                color: #ffd700;
            }
            .toast.ether {
                border-color: #9d00ff;
                color: #9d00ff;
            }
            .toast.star {
                border-color: #ffffff;
                color: #ffffff;
                text-shadow: 0 0 10px #ffffff;
            }
        </style>
    </head>
    <body>
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            <div id="message-overlay">
                <div class="toast" id="toast-msg">Message</div>
            </div>

            <!-- START / MENU SCREEN -->
            <div id="start-screen">
                <div class="menu-content">
                    <h1>KONNO</h1>
                    <p style="color: #aaa; margin-bottom: 20px">
                        Astral Energy Collector
                    </p>
                    <p
                        style="
                            color: #ffd700;
                            margin-bottom: 20px;
                            font-size: 14px;
                        "
                    >
                        Optimized & Expanded Galaxy
                    </p>

                    <input
                        type="text"
                        id="save-name-input"
                        class="menu-input"
                        placeholder="Enter Save Name..."
                        maxlength="20"
                    />

                    <button class="menu-btn save" onclick="saveGame()">
                        SAVE & DOWNLOAD
                    </button>
                    <label for="file-input">
                        <div class="menu-btn">LOAD FILE</div>
                    </label>
                    <input
                        type="file"
                        id="file-input"
                        accept=".json"
                        style="display: none"
                        onchange="loadGame(this)"
                    />

                    <button class="menu-btn" onclick="startNewGame()">
                        NEW GAME
                    </button>
                    <p style="font-size: 12px; color: #666; margin-top: 20px">
                        ESC to Toggle Menu
                    </p>
                </div>
            </div>
        </div>

            function loadImages() {
                const loadSet = (srcArray, targetArray) => {
                    if (!srcArray || srcArray.length === 0) return;
                    if (!targetArray) return;
                    srcArray.forEach((src) => {
                        const img = new Image();
                        img.src = src;
                        targetArray.push(img);
                    });
                };

                loadSet(srcs.walk, character.walkFrames);
                loadSet(srcs.idle, character.idleFrames);
                loadSet(srcs.jump, character.jumpFrames);
                loadSet(srcs.glowing, character.glowingFrames);

            function initStars() {
                stars = [];
                const centerX = 400;
                const centerY = STAR_CENTER_Y; // High in sky

                const goldenAngle = Math.PI * (3 - Math.sqrt(5));

                for (let i = 0; i < STAR_COUNT; i++) {
                    // r = spacing * sqrt(n)
                    const r = STAR_SPACING * Math.sqrt(i + 1);
                    const theta = i * goldenAngle;

                    const x = centerX + r * Math.cos(theta);
                    const y = centerY + r * Math.sin(theta);

                    stars.push({
                        id: i,
                        x: x,
                        y: y,
                        found: false,
                        forestActivated: false,
                        pulseOffset: Math.random() * Math.PI * 2,
                        sizeVariation: 0.8 + Math.random() * 0.5,
                        colorVar: "#FFD700",
                    });
                }
            }

                character.raFloatingRightFrameIndex = 0;
                character.raFloatingRightFrameCounter = 0;
                character.spreadWingsFrameIndex = 0;
                character.spreadWingsFrameCounter = 0;

                toggleMenu(false);
            }

            function saveGame() {
                const nameInput = document.getElementById("save-name-input");
                let fileName = "Konno_Save";
                if (nameInput && nameInput.value.trim() !== "") {
                    fileName = nameInput.value
                        .trim()
                        .replace(/[^a-z0-9_\-]/gi, "_");
                }

                const saveData = {
                    character: {
                        x: character.x,
                        y: character.y,
                        groundY: character.groundY,
                        direction: character.direction,
                        velocityY: character.velocityY,
                        isMoving: character.isMoving,
                        isJumping: character.isJumping,
                        isFloating: character.isFloating,
                        isFlyingUp: character.isFlyingUp,
                        isFlyingDown: character.isFlyingDown,
                        isLanding: character.isLanding,
                        isBoost: character.isBoost,
                        isTurbo: character.isTurbo,
                        isTransformed: character.isTransformed,
                        isTransforming: character.isTransforming,
                        isRaFloating: character.isRaFloating,
                        isRaFloatingRight: character.isRaFloatingRight,
                        isRaFloatingUp: character.isRaFloatingUp,
                        isRaFloatingDown: character.isRaFloatingDown,
                        isSpreadingWings: character.isSpreadingWings,
                        transformationFrameIndex:
                            character.transformationFrameIndex,
                        konnoRaIdleFrameIndex: character.konnoRaIdleFrameIndex,
                        konnoRaWalkingFrameIndex:
                            character.konnoRaWalkingFrameIndex,
                        raFloatingFrameIndex: character.raFloatingFrameIndex,
                        raFlyingRightFrameIndex:
                            character.raFlyingRightFrameIndex,
                        spreadWingsFrameIndex: character.spreadWingsFrameIndex,
                    },
                    currencies: {
                        energy: collectedEnergy,
                        ether: collectedEther,
                        aurels: collectedAurels,
                    },
                    world: {
                        objects: worldObjects,
                        energyOrbs: energyOrbs,
                        etherPixels: etherPixels,
                        grounds: grounds,
                        cores: geometricCores,
                        stars: stars,
                    },
                    systems: {
                        activeForests: activeForestCenters,
                        lastAutoSpawn: lastAutoSpawnTime,
                        lastAurelSpawn: lastAurelSpawnTime,
                        lastForestSpawn: lastForestSpawnTime,
                        allStarsActive: allStarsActive,
                        lastStarAurelSpawn: lastStarAurelSpawnTime,
                        sunCircle: sunCircle,
                        starAurels: starAurels,
                        allStarsCenterX: allStarsCenterX,
                        allStarsCenterY: allStarsCenterY,
                    },
                };

                const dataStr = JSON.stringify(saveData);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                a.download = `${fileName}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                addFloatingText(
                    "GAME SAVED!",
                    character.x,
                    character.y - 50,
                    "#FFD700",
                );
            }

            function loadGame(inputElement) {
                const file = inputElement.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const data = JSON.parse(e.target.result);

                        if (data.character) {
                            character.x = data.character.x;
                            character.y = data.character.y;
                            character.groundY = data.character.groundY;
                            character.direction = data.character.direction;
                            character.velocityY = data.character.velocityY;
                            character.isMoving = data.character.isMoving;
                            character.isJumping = data.character.isJumping;
                            character.isFloating = data.character.isFloating;
                            character.isFlyingUp = data.character.isFlyingUp;
                            character.isFlyingDown =
                                data.character.isFlyingDown;

                            character.isRaFloatingRight =
                                data.character.isRaFloatingRight || false;
                            character.raFloatingRightFrameIndex =
                                data.character.raFlyingRightFrameIndex || 0;
                            character.isRaFloatingUp =
                                data.character.isRaFloatingUp || false;
                            character.isRaFloatingDown =
                                data.character.isRaFloatingDown || false;
                            character.isLanding = data.character.isLanding;
                            character.isBoost = data.character.isBoost;
                            character.isTurbo = data.character.isTurbo;
                            character.isTransformed =
                                data.character.isTransformed || false;
                            character.isTransforming =
                                data.character.isTransforming || false;
                            character.transformationFrameIndex =
                                data.character.transformationFrameIndex || 0;
                            character.konnoRaWalkingFrameIndex =
                                data.character.konnoRaWalkingFrameIndex || 0;
                            character.konnoRaIdleFrameIndex =
                                data.character.konnoRaIdleFrameIndex || 0;
                            character.isSpreadingWings =
                                data.character.isSpreadingWings || false;
                            character.spreadWingsFrameIndex =
                                data.character.spreadWingsFrameIndex || 0;
                        }

                        if (data.currencies) {
                            collectedEnergy = data.currencies.energy;
                            collectedEther = data.currencies.ether;
                            collectedAurels = data.currencies.aurels;
                        }

                        if (data.world) {
                            worldObjects = data.world.objects || [];
                            energyOrbs = data.world.energyOrbs || [];
                            etherPixels = data.world.etherPixels || [];
                            grounds = data.world.grounds || [];
                            geometricCores = data.world.cores || [];
                            stars = data.world.stars || [];

                            if (energyOrbs.length > MAX_ENERGY_ORBS)
                                energyOrbs.splice(
                                    0,
                                    energyOrbs.length - MAX_ENERGY_ORBS,
                                );
                            if (etherPixels.length > MAX_ETHER_PIXELS)
                                etherPixels.splice(
                                    0,
                                    etherPixels.length - MAX_ETHER_PIXELS,
                                );
                        }

                        if (data.systems) {
                            activeForestCenters =
                                data.systems.activeForests || [];
                            lastAutoSpawnTime =
                                data.systems.lastAutoSpawn || Date.now();
                            lastAurelSpawnTime =
                                data.systems.lastAurelSpawn || Date.now();
                            lastForestSpawnTime =
                                data.systems.lastForestSpawn || Date.now();
                            allStarsActive =
                                data.systems.allStarsActive || false;
                            lastStarAurelSpawnTime =
                                data.systems.lastStarAurelSpawn || Date.now();
                            sunCircle = data.systems.sunCircle || null;
                            starAurels = data.systems.starAurels || [];
                            allStarsCenterX = data.systems.allStarsCenterX || 0;
                            allStarsCenterY = data.systems.allStarsCenterY || 0;
                        }

                        toggleMenu(false);
                        addFloatingText(
                            "GAME LOADED!",
                            character.x,
                            character.y - 50,
                            "#00FFFF",
                        );
                    } catch (err) {
                        console.error("Save load error:", err);
                        alert("Error loading save file: " + err);
                    }
                };
                reader.readAsText(file);
            }

            function toggleMenu(show) {
                const menu = document.getElementById("start-screen");
                isGameRunning = !show;
                menu.style.display = show ? "flex" : "none";
                console.log("Menu toggled. Game Running:", isGameRunning);
            }

            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    const menu = document.getElementById("start-screen");
                    const isMenuShown =
                        menu.style.display !== "none" &&
                        menu.style.display !== "";
                    toggleMenu(!isMenuShown);
                }
            });

            grounds.push({ y: 600, type: "default" });

            function spawnOrbs(x, y, count, isAurel = false) {
                const spawnCount = count || ORBS_DROPPED_PER_TREE;
                for (let i = 0; i < spawnCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 50 + Math.random() * 300;
                    const spawnX = x + Math.cos(angle) * radius;
                    const spawnY = y + Math.sin(angle) * radius;

                    const orbColor = isAurel
                        ? "#FFD700"
                        : Math.random() > 0.9
                          ? "#FFD700"
                          : "#00FFFF";
                    const orbSize = isAurel ? 8 : 4 + Math.random() * 4;
                    const orbValue = isAurel ? AUREL_VALUE : 1;

                    energyOrbs.push({
                        id: Date.now() + Math.random(),
                        x: spawnX,
                        y: spawnY,
                        baseY: spawnY,
                        vx: (Math.random() - 0.5) * ORB_DRIFT_SPEED,
                        floatSpeed: 0.02 + Math.random() * 0.04,
                        angleOffset: Math.random() * Math.PI * 2,
                        color: orbColor,
                        size: orbSize,
                        pixelJitter: 2,
                        value: orbValue,
                        mergeTarget: null,
                        mergeStartTime: 0,
                        isAurel: isAurel,
                    });
                }
            }

            function spawnEther(x, y, count) {
                if (etherPixels.length >= MAX_ETHER_PIXELS) return;
                const spawnCount = count || ETHER_SPAWN_AMOUNT;
                for (let i = 0; i < spawnCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 30 + Math.random() * 100;
                    const spawnX = x + Math.cos(angle) * radius;
                    const spawnY = y + Math.sin(angle) * radius;

                    etherPixels.push({
                        id: Date.now() + Math.random() + 10000,
                        x: spawnX,
                        y: spawnY,
                        baseY: spawnY,
                        vx: (Math.random() - 0.5) * 0.2,
                        floatSpeed: 0.01 + Math.random() * 0.02,
                        angleOffset: Math.random() * Math.PI * 2,
                        color: "#9D00FF",
                        size:
                            ETHER_SIZE_BASE +
                            Math.random() * ETHER_SIZE_VARIANCE,
                        pixelJitter: 1.5,
                        value: 1,
                        mergeTarget: null,
                        mergeStartTime: 0,
                    });
                }
            }

            function showToast(msg, type = "") {
                const el = document.getElementById("toast-msg");
                const overlay = document.getElementById("message-overlay");
                el.innerText = msg;
                el.className = "toast " + type;
                overlay.style.opacity = 1;

                if (overlay.hideTimeout) clearTimeout(overlay.hideTimeout);

                overlay.hideTimeout = setTimeout(() => {
                    overlay.style.opacity = 0;
                }, 3000);
            }

            function addFloatingText(text, x, y, color) {
                floatingTexts.push({
                    text: text,
                    x: x,
                    y: y,
                    life: 60,
                    color: color,
                });
            }

            const keys = {};
            let spaceKeyState = false;
            let lastSpaceKeyTime = 0;

            window.addEventListener("keydown", (e) => {
                if (!isGameRunning) return;

                if (
                    [
                        "Space",
                        "ArrowUp",
                        "ArrowDown",
                        "ArrowLeft",
                        "ArrowRight",
                    ].indexOf(e.code) > -1
                ) {
                    e.preventDefault();
                }

                keys[e.key.toLowerCase()] = true;

                // Track space key state
                if (e.key === " ") {
                    spaceKeyState = true;
                }

                // Track D key for RaFloatingRight transition
                if (e.key.toLowerCase() === "d") {
                    console.log(
                        "D pressed - isRaFloating:",
                        character.isRaFloating,
                    );
                    // Transition from RaFloating to RaFlyingRight
                    if (
                        character.isRaFloating &&
                        !character.isRaFloatingRight
                    ) {
                        character.isRaFloating = false;
                        character.isRaFloatingRight = true;
                        character.raFlyingRightFrameIndex = 0;
                        character.raFlyingRightFrameCounter = 0;
                        character.direction = "right"; // Set direction to right
                    }
                }

                if (e.key.toLowerCase() === "a") {
                    console.log(
                        "A pressed - isRaFloating:",
                        character.isRaFloating,
                    );
                    // Transition from RaFloating to RaFlyingRight (with left direction)
                    if (
                        character.isRaFloating &&
                        !character.isRaFloatingRight
                    ) {
                        character.isRaFloating = false;
                        character.isRaFloatingRight = true;
                        character.raFlyingRightFrameIndex = 0;
                        character.raFlyingRightFrameCounter = 0;
                        character.direction = "left"; // Set direction to left
                    }
                }

                const handlePlanting = (treeType) => {
                    const now = Date.now();
                    if (now - lastPlantTime < PLANTING_COOLDOWN_MS) {
                        const cooldownLeft = (
                            (PLANTING_COOLDOWN_MS - (now - lastPlantTime)) /
                            1000
                        ).toFixed(1);
                        addFloatingText(
                            `Wait ${cooldownLeft}s`,
                            character.x,
                            character.y - 50,
                            "#FF8888",
                        );
                        return;
                    }
                    if (collectedEnergy >= ENERGY_COST_TO_PLANT) {
                        collectedEnergy -= ENERGY_COST_TO_PLANT;
                        addFloatingText(
                            `-${ENERGY_COST_TO_PLANT} Energy`,
                            character.x,
                            character.y - 50,
                            "#FF4444",
                        );
                        lastPlantTime = now;

                        const depthLayer = Math.floor(Math.random() * 3);
                        const scales = [0.4, 0.7, 1.0, 1.3, 1.6];
                        const treeScale =
                            scales[Math.floor(Math.random() * scales.length)];
                        const yOffsets = [-150, -50, 0];
                        const yOffset = yOffsets[depthLayer];
                        const xVariance = (Math.random() - 0.5) * 100;
                        const spawnX =
                            character.x + character.width / 2 + xVariance;
                        const spawnY = character.groundY + yOffset;

                        const isAnimatedTree = treeType === "P";

                        const newTreeObj = {
                            x: spawnX,
                            y: spawnY,
                            state: isAnimatedTree
                                ? "growing"
                                : "growing-new-tree",
                            type: isAnimatedTree ? "animated-tree" : "new-tree",
                            frameIndex: 0,
                            frameCounter: 0,
                            frameDelay: 7,
                            plantScale: 1.0,
                            treeScale: treeScale,
                            depthLayer: depthLayer,
                            parallaxMultiplier: 1 - depthLayer * 0.3,
                            etherTimer: Date.now() + 2000,
                        };

                        worldObjects.push(newTreeObj);
                        spawnOrbs(spawnX, spawnY);
                    } else {
                        addFloatingText(
                            "Need Energy!",
                            character.x,
                            character.y - 50,
                            "#FF0000",
                        );
                    }
                };

                if (e.key.toLowerCase() === "p") handlePlanting("P");
                if (e.key.toLowerCase() === "o") handlePlanting("O");

                if (e.key.toLowerCase() === "b") {
                    const now = Date.now();
                    if (now - lastPlantTime < 1000) {
                        addFloatingText(
                            "Wait 1s",
                            character.x,
                            character.y - 50,
                            "#FF8888",
                        );
                        return;
                    }
                    if (collectedEther >= NEW_GROUND_COST_ETHER) {
                        collectedEther -= NEW_GROUND_COST_ETHER;
                        addFloatingText(
                            `-${NEW_GROUND_COST_ETHER} Ether`,
                            character.x,
                            character.y - 50,
                            "#9D00FF",
                        );
                        lastPlantTime = now;

                        const spawnY = character.y + character.height;
                        const spawnX =
                            character.x +
                            character.width / 2 -
                            NEW_GROUND_WIDTH / 2;

                        grounds.push({
                            x: spawnX,
                            y: spawnY,
                            width: NEW_GROUND_WIDTH,
                            type: "particle",
                            created: now,
                        });
                    } else {
                        addFloatingText(
                            `Need ${NEW_GROUND_COST_ETHER} Ether!`,
                            character.x,
                            character.y - 50,
                            "#FF00FF",
                        );
                    }
                }

                // === SPACE KEY HANDLING ===
                if (e.key === " " && !character.isGlowing) {
                    if (character.isTransformed) {
                        // === TRANSFORMED CHARACTER SPACE KEY HANDLING ===
                        const now = Date.now();

                        // Track double-press for Ra Floating mode
                        if (now - lastSpaceKeyTime < 500) {
                            // Double press detected
                            if (
                                !character.isRaFloating &&
                                !character.isRaFloatingRight
                            ) {
                                character.isRaFloating = true;
                                character.raFloatingFrameIndex = 0;
                                character.raFloatingFrameCounter = 0;
                                character.raFloatingRightFrameIndex = 0;
                                character.raFloatingRightFrameCounter = 0;
                                showToast("Ra Floating!", "gold");
                                addFloatingText(
                                    "Ra Floating!",
                                    character.x,
                                    character.y - 100,
                                    "#FFD700",
                                );
                            }
                        }
                        lastSpaceKeyTime = now;

                        // Save current state before any changes
                        const wasSpreadingWings = character.isSpreadingWings;

                        // Space key logic for KonnoRa - spreadWings → RaFloating → Landing

                        // Single press - activate SpreadWings animation if idling
                        if (
                            !character.isRaFloating &&
                            !character.isRaFloatingRight &&
                            !character.isRaFloatingUp &&
                            !character.isRaFloatingDown &&
                            !character.isSpreadingWings &&
                            !character.isMoving
                        ) {
                            character.isSpreadingWings = true;
                            character.spreadWingsFrameIndex = 0;
                            character.spreadWingsFrameCounter = 0;
                        }

                        // Transition from SpreadWings to RaFloating
                        if (wasSpreadingWings && character.isSpreadingWings) {
                            character.isSpreadingWings = false;
                            character.isRaFloating = true;
                            character.raFloatingFrameIndex = 0;
                            character.raFloatingFrameCounter = 0;
                            character.raFloatingRightFrameIndex = 0;
                            character.raFloatingRightFrameCounter = 0;
                            showToast("Ra Floating!", "gold");
                            addFloatingText(
                                "Ra Floating!",
                                character.x,
                                character.y - 100,
                                "#FFD700",
                            );
                        }

                        // Transition from RaFloating to Landing (second press after spreadWings)
                        if (
                            (character.isRaFloating ||
                                character.isRaFloatingRight ||
                                character.isRaFloatingUp ||
                                character.isRaFloatingDown) &&
                            !wasSpreadingWings
                        ) {
                            // Deactivate RaFloating mode
                            character.isRaFloating = false;
                            character.isRaFloatingRight = false;
                            character.isRaFloatingUp = false;
                            character.isRaFloatingDown = false;
                            character.isLanding = true;
                            character.landFrameIndex = 0;
                            character.landFrameCounter = 0;
                            character.velocityY = 0;
                            character.landingFlipLeft =
                                character.direction === "left";
                            // Reset flying animation counters
                            character.raFloatingRightFrameIndex = 0;
                            character.raFloatingRightFrameCounter = 0;
                            character.raFloatingFrameIndex = 0;
                            character.raFloatingFrameCounter = 0;
                            showToast("Landing!", "gold");
                            addFloatingText(
                                "Landing!",
                                character.x,
                                character.y - 100,
                                "#FFD700",
                            );
                        }

                        // Landing logic for transformed character (only when space is released)
                        if (
                            (character.isRaFloating ||
                                character.isRaFloatingRight) &&
                            !spaceKeyState
                        ) {
                            character.isRaFloating = false;
                            character.isRaFloatingRight = false;
                            character.velocityY = 0;
                            character.y = character.groundY - character.height;
                            character.floatFrameIndex = 0;
                        }
                    } else {
                        // === NORMAL CHARACTER SPACE KEY HANDLING ===
                        if (character.isLanding) {
                            // Landing + space → Floating
                            character.isLanding = false;
                            character.isFloating = true;
                            character.velocityY = 0;
                            character.floatFrameIndex = 0;
                        } else if (character.isFloating) {
                            // Floating + space → Landing
                            character.isFloating = false;
                            character.isLanding = true;
                            character.landFrameIndex = 0;
                            character.landFrameCounter = 0;
                        } else if (character.isJumping) {
                            // Jump + space → Floating
                            character.isJumping = false;
                            character.isFloating = true;
                            character.floatFrameIndex = 0;
                        } else {
                            // Not jumping → Jump
                            character.isJumping = true;
                            character.velocityY = -character.jumpPower;
                            character.jumpFrameIndex = 0;
                        }
                    }
                }

                if (
                    e.key.toLowerCase() === "g" &&
                    !character.isGlowing &&
                    !character.isJumping &&
                    !character.isFloating &&
                    !character.isLanding
                ) {
                    character.isGlowing = true;
                    character.glowingFrameIndex = 0;
                }

                // T key - Toggle transformation between KonnoRa and regular
                if (e.key.toLowerCase() === "t") {
                    console.log(
                        "T pressed - current isTransformed:",
                        character.isTransformed,
                    );
                    if (!character.isTransformed) {
                        // Start transformation to KonnoRa
                        character.isTransforming = true;
                        character.isTransformed = false; // Will be set to true after animation
                        character.transformationFrameIndex = 0;
                        character.transformationFrameCounter = 0;
                        showToast("Transforming to KonnoRa!", "star");
                        addFloatingText(
                            "Transforming!",
                            character.x,
                            character.y - 100,
                            "#FFD700",
                        );
                    } else {
                        // De-transform back to regular
                        character.isTransformed = false;
                        character.isTransforming = false;
                        character.idleFrameIndex = 0;
                        character.idleFrameCounter = 0;
                        showToast("Back to normal!", "gold");
                        addFloatingText(
                            "De-transformed!",
                            character.x,
                            character.y - 100,
                            "#00FF00",
                        );
                    }
                }

                if (e.key.toLowerCase() === "w") {
                    console.log(
                        "W pressed - isTransformed:",
                        character.isTransformed,
                        "isRaFloating:",
                        character.isRaFloating,
                    );
                    if (character.isTransformed) {
                        // Transformed character
                        if (character.isRaFloating) {
                            // Transition from RaFloating to RaFloatingUp (flying animation)
                            character.isRaFloating = false;
                            character.isRaFloatingUp = true;
                            character.raFlyingRightFrameIndex = 0;
                            character.raFlyingRightFrameCounter = 0;
                        } else if (character.isRaFloatingDown) {
                            // Already flying down, switch to up
                            character.isRaFloatingDown = false;
                            character.isRaFloatingUp = true;
                        }
                    } else {
                        // Normal character
                        if (
                            !character.isFlyingUp &&
                            !character.isFlyingDown &&
                            !character.isLanding &&
                            !character.isRaFloating &&
                            !character.isRaFloatingRight
                        ) {
                            if (character.isFloating) {
                                character.isFloating = false;
                                character.isFlyingUp = true;
                                character.flyUpFrameIndex = 0;
                            } else if (
                                !character.isJumping &&
                                !character.isBoost &&
                                !character.isTurbo
                            ) {
                                character.isFloating = true;
                                character.isFlyingUp = true;
                                character.floatFrameIndex = 0;
                            }
                        }
                    }
                }

                if (e.key.toLowerCase() === "s") {
                    console.log(
                        "S pressed - isTransformed:",
                        character.isTransformed,
                        "isRaFloating:",
                        character.isRaFloating,
                    );
                    if (character.isTransformed) {
                        // Transformed character
                        if (character.isRaFloating) {
                            // Transition from RaFloating to RaFloatingDown (flying animation)
                            character.isRaFloating = false;
                            character.isRaFloatingDown = true;
                            character.raFlyingRightFrameIndex = 0;
                            character.raFlyingRightFrameCounter = 0;
                        } else if (character.isRaFloatingUp) {
                            // Already flying up, switch to down
                            character.isRaFloatingUp = false;
                            character.isRaFloatingDown = true;
                        }
                    } else {
                        // Normal character
                        if (
                            !character.isFlyingUp &&
                            !character.isFlyingDown &&
                            !character.isLanding &&
                            !character.isRaFloating &&
                            !character.isRaFloatingRight
                        ) {
                            if (character.isFloating) {
                                character.isFloating = false;
                                character.isFlyingDown = true;
                                character.flyDownFrameIndex = 0;
                            } else if (
                                !character.isJumping &&
                                !character.isBoost &&
                                !character.isTurbo
                            ) {
                                character.isFloating = true;
                                character.isFlyingDown = true;
                                character.floatFrameIndex = 0;
                            }
                        }
                    }
                }

                if (
                    e.key === "Shift" &&
                    (character.isFloating ||
                        character.isFlyingUp ||
                        character.isFlyingDown) &&
                    !character.isBoost &&
                    !character.isTurbo &&
                    (keys["a"] || keys["d"] || keys["w"] || keys["s"])
                ) {
                    character.isBoost = true;
                    character.boostStartTime = Date.now();
                    character.boostFrameIndex = 0;
                }

                if (e.key === "+" || e.key === "=") {
                    zoom = Math.min(zoom + zoomStep, maxZoom);
                }
                if (e.key === "-" || e.key === "_") {
                    zoom = Math.max(zoom - zoomStep, minZoom);
                }
                if (e.key === "0") {
                    zoom = 1;
                }
                if (e.key.toLowerCase() === "h") showUI = !showUI;
            });

            window.addEventListener("keyup", (e) => {
                if (!isGameRunning) return;

                keys[e.key.toLowerCase()] = false;

                // Reset space key state
                if (e.key === " ") {
                    spaceKeyState = false;
                }

                // Handle W and S keyup for RaFloating flying states
                if (character.isTransformed) {
                    if (e.key.toLowerCase() === "w") {
                        if (character.isRaFloatingUp) {
                            character.isRaFloatingUp = false;
                            // Reset flying animation counter
                            character.raFlyingRightFrameIndex = 0;
                            character.raFlyingRightFrameCounter = 0;
                            // If not flying down, return to RaFloating
                            if (!character.isRaFloatingDown) {
                                character.isRaFloating = true;
                                character.raFloatingFrameIndex = 0;
                                character.raFloatingFrameCounter = 0;
                            }
                        }
                    }
                    if (e.key.toLowerCase() === "s") {
                        if (character.isRaFloatingDown) {
                            character.isRaFloatingDown = false;
                            // Reset flying animation counter
                            character.raFloatingRightFrameIndex = 0;
                            character.raFlyingRightFrameCounter = 0;
                            // If not flying up, return to RaFloating
                            if (!character.isRaFloatingUp) {
                                character.isRaFloating = true;
                                character.raFloatingFrameIndex = 0;
                                character.raFloatingFrameCounter = 0;
                            }
                        }
                    }
                }

                if (
                    e.key === "Shift" &&
                    (character.isBoost || character.isTurbo)
                ) {
                    character.isBoost = false;
                    character.isTurbo = false;
                    character.isFloating = false;
                    character.isFlyingUp = false;
                    character.isFlyingDown = false;
                    character.isRaFloatingRight = false;
                    character.isLanding = true;
                    character.landFrameIndex = 0;
                    character.boostStartTime = 0;
                }

                if (e.key.toLowerCase() === "w" && character.isFlyingUp) {
                    character.isFlyingUp = false;
                    character.isFloating = true;
                    character.floatFrameIndex = 0;
                }

                if (e.key.toLowerCase() === "s" && character.isFlyingDown) {
                    character.isFlyingDown = false;
                    character.isFloating = true;
                    character.floatFrameIndex = 0;
                }

                if (
                    e.key.toLowerCase() === "a" &&
                    character.isRaFloatingRight
                ) {
                    character.isRaFloatingRight = false;
                    // Reset flying animation counter
                    character.raFlyingRightFrameIndex = 0;
                    character.raFlyingRightFrameCounter = 0;
                    character.isRaFloating = true;
                    character.raFloatingFrameIndex = 0;
                    character.raFloatingFrameCounter = 0;
                }
                if (
                    e.key.toLowerCase() === "d" &&
                    character.isRaFloatingRight
                ) {
                    character.isRaFloatingRight = false;
                    // Reset flying animation counter
                    character.raFlyingRightFrameIndex = 0;
                    character.raFlyingRightFrameCounter = 0;
                    character.isRaFloating = true;
                    character.raFloatingFrameIndex = 0;
                    character.raFloatingFrameCounter = 0;
                }
            });

            canvas.addEventListener("wheel", (e) => {
                if (!isGameRunning) return;
                e.preventDefault();
                const oldZoom = zoom;
                if (e.deltaY < 0) zoom = Math.min(zoom + zoomStep, maxZoom);
                else zoom = Math.max(zoom - zoomStep, minZoom);
            });

            function detectForest() {
                const trees = worldObjects.filter(
                    (obj) =>
                        obj.state === "grown" || obj.state === "grown-new-tree",
                );
                activeForestCenters = [];

                if (trees.length < FOREST_SIZE_THRESHOLD) {
                    return;
                }

                const assignedTreeIndices = new Set();
                trees.sort((a, b) => a.x - b.x);

                for (let i = 0; i < trees.length; i++) {
                    let t = trees[i];
                    if (assignedTreeIndices.has(i)) continue;

                    let currentCluster = [t];
                    assignedTreeIndices.add(i);

                    for (let j = i + 1; j < trees.length; j++) {
                        let other = trees[j];
                        if (assignedTreeIndices.has(j)) continue;
                        if (other.x - t.x > FOREST_CLUSTER_RADIUS) break;

                        let inCluster = false;
                        for (let k = 0; k < currentCluster.length; k++) {
                            if (
                                Math.hypot(
                                    other.x - currentCluster[k].x,
                                    other.y - currentCluster[k].y,
                                ) < FOREST_CLUSTER_RADIUS
                            ) {
                                inCluster = true;
                                break;
                            }
                        }

                        if (inCluster) {
                            currentCluster.push(other);
                            assignedTreeIndices.add(j);
                        }
                    }

                    if (currentCluster.length >= FOREST_SIZE_THRESHOLD) {
                        let sumX = 0,
                            sumY = 0;
                        currentCluster.forEach((t) => {
                            sumX += t.x;
                            sumY += t.y;
                        });
                        activeForestCenters.push({
                            x: sumX / currentCluster.length,
                            y: sumY / currentCluster.length,
                        });
                    }
                }
            }

            function update() {
                if (!isGameRunning) return;

                cameraOffsetX += (targetCameraOffsetX - cameraOffsetX) * 0.1;
                cameraOffsetY += (targetCameraOffsetY - cameraOffsetY) * 0.1;

                // === CULLING OPTIMIZATION ===
                const viewPaddingUpdate = 1500; // Wide padding to keep sim running off-screen
                const viewPaddingDraw = 500; // Tighter padding for drawing
                const viewLeft =
                    character.x - canvas.width / zoom - viewPaddingUpdate;
                const viewRight =
                    character.x + canvas.width / zoom + viewPaddingUpdate;
                const viewTop =
                    character.y - canvas.height / zoom - viewPaddingUpdate;
                const viewBottom =
                    character.y + canvas.height / zoom + viewPaddingUpdate;
                // ===========================

                if (energyOrbs.length > MAX_ENERGY_ORBS) {
                    energyOrbs.splice(0, energyOrbs.length - MAX_ENERGY_ORBS);
                }
                if (etherPixels.length > MAX_ETHER_PIXELS) {
                    etherPixels.splice(
                        0,
                        etherPixels.length - MAX_ETHER_PIXELS,
                    );
                }

                detectForest();
                const now = Date.now();

                if (now - lastAutoSpawnTime > AUTO_SPAWN_INTERVAL_MS) {
                    spawnOrbs(
                        character.x,
                        character.y,
                        AUTO_SPAWN_COUNT,
                        false,
                    );
                    lastAutoSpawnTime = now;
                }

                // === FOREST AUREL SPAWN LOGIC ===
                if (activeForestCenters.length > 0) {
                    if (now - lastAurelSpawnTime > AUREL_SPAWN_RATE_MS) {
                        const randomForest =
                            activeForestCenters[
                                Math.floor(
                                    Math.random() * activeForestCenters.length,
                                )
                            ];
                        const spawnX =
                            randomForest.x + (Math.random() - 0.5) * 300;
                        const spawnY =
                            randomForest.y - 200 + Math.random() * 100;
                        spawnOrbs(spawnX, spawnY, 1, true);
                        lastAurelSpawnTime = now;
                        addFloatingText(
                            "FOREST AUREL!",
                            spawnX,
                            spawnY - 50,
                            "#FFD700",
                        );
                    }
                }
                // ===============================

                // === FOREST STAR ACTIVATION LOGIC ===
                if (activeForestCenters.length > 0) {
                    stars.forEach((star) => {
                        if (!star.forestActivated) {
                            for (const center of activeForestCenters) {
                                const dist = Math.hypot(
                                    star.x - center.x,
                                    star.y - center.y,
                                );
                                if (dist <= FOREST_STAR_ACTIVATION_RADIUS) {
                                    star.forestActivated = true;
                                    showToast(`GOLDEN STAR ACTIVE!`, "star");
                                    addFloatingText(
                                        `GOLDEN STAR ACTIVE!`,
                                        star.x,
                                        star.y - 80,
                                        "#FFD700",
                                    );
                                    break;
                                }
                            }
                        }
                    });
                }
                // =======================================

                // === ALL STARS ACTIVE EVENT ===
                // Check if all forests are activated
                if (!allStarsActive) {
                    const allForestsActivated = stars.every(
                        (star) => star.forestActivated,
                    );
                    if (allForestsActivated) {
                        allStarsActive = true;
                        showToast("ALL FORESTS ACTIVATED!", "star");
                        addFloatingText(
                            "ALL FORESTS ACTIVATED!",
                            character.x,
                            character.y - 100,
                            "#FFD700",
                        );

                        // Calculate center point between all stars
                        let sumX = 0,
                            sumY = 0;
                        stars.forEach((star) => {
                            sumX += star.x;
                            sumY += star.y;
                        });
                        allStarsCenterX = sumX / stars.length;
                        allStarsCenterY = sumY / stars.length;

                        // Spawn the golden sun circle immediately
                        sunCircle = {
                            x: allStarsCenterX,
                            y: allStarsCenterY,
                            radius: 0,
                            targetRadius: SUN_CIRCLE_RADIUS,
                            alpha: 0,
                            pulseOffset: 0,
                            created: now,
                            hasBeenInteracted: false,
                        };
                        showToast("THE SUN IS BORN!", "star");
                        addFloatingText(
                            "THE SUN IS BORN!",
                            allStarsCenterX,
                            allStarsCenterY - 200,
                            "#FFFFAA",
                        );
                    }
                }

                // Update sun circle if it exists
                if (sunCircle) {
                    if (sunCircle.radius < sunCircle.targetRadius) {
                        sunCircle.radius += 2;
                    }
                    if (sunCircle.alpha < 1) {
                        sunCircle.alpha += 0.02;
                    }
                    sunCircle.pulseOffset = (now - sunCircle.created) / 1000;

                    // Check if character can interact with sun circle (immediately)
                    if (
                        !sunCircle.hasBeenInteracted &&
                        !character.isTransforming &&
                        !character.isTransformed
                    ) {
                        const distToSun = Math.hypot(
                            character.x - sunCircle.x,
                            character.y - sunCircle.y,
                        );

                        if (distToSun < SUN_CIRCLE_INTERACT_RADIUS) {
                            // Start transformation!
                            character.isTransforming = true;
                            character.isTransformed = false;
                            character.konnoRaBornFrameIndex = 0;
                            character.konnoRaBornFrameCounter = 0;
                            sunCircle.hasBeenInteracted = true;

                            showToast("KONNO RA IS BORN!", "star");
                            addFloatingText(
                                "KONNO RA IS BORN!",
                                character.x,
                                character.y - 100,
                                "#FFD700",
                            );
                        }
                    }

                    // === SPAWN AURELS FROM STARS TO CENTER (10 second event) ===
                    if (allStarsActive && sunCircle) {
                        const timeSinceSunCreated = now - sunCircle.created;

                        // Only spawn aurels during the first 10 seconds
                        if (
                            timeSinceSunCreated < SUN_CIRCLE_INTERACT_DELAY_MS
                        ) {
                            if (
                                now - lastStarAurelSpawnTime >
                                ALL_STARS_AUREL_SPAWN_RATE
                            ) {
                                // Spawn one aurel from each activated star
                                stars.forEach((star) => {
                                    if (star.found) {
                                        // Calculate direction from star to center
                                        const dx = allStarsCenterX - star.x;
                                        const dy = allStarsCenterY - star.y;
                                        const dist = Math.hypot(dx, dy);
                                        const vx =
                                            (dx / dist) * ALL_STARS_AUREL_SPEED;
                                        const vy =
                                            (dy / dist) * ALL_STARS_AUREL_SPEED;

                                        starAurels.push({
                                            id: Date.now() + Math.random(),
                                            x: star.x,
                                            y: star.y,
                                            vx: vx,
                                            vy: vy,
                                            size: 8 + Math.random() * 4,
                                            color: `hsl(${40 + Math.random() * 30}, 100%, ${70 + Math.random() * 15}%)`,
                                            pulseOffset:
                                                Math.random() * Math.PI * 2,
                                            sourceStarId: star.id,
                                        });
                                    }
                                });
                                lastStarAurelSpawnTime = now;
                            }
                        }
                    }

                    // === UPDATE STAR AURELS (move toward center) ===
                    for (let i = starAurels.length - 1; i >= 0; i--) {
                        const aurel = starAurels[i];

                        // Move aurel toward center
                        aurel.x += aurel.vx;
                        aurel.y += aurel.vy;
                        aurel.pulseOffset += 0.05;

                        // Check if aurel reached the center (merge)
                        const distToCenter = Math.hypot(
                            aurel.x - allStarsCenterX,
                            aurel.y - allStarsCenterY,
                        );

                        if (distToCenter < ALL_STARS_MERGE_DISTANCE) {
                            // Remove aurel when it merges at center
                            starAurels.splice(i, 1);
                        }
                    }
                }

                if (activeForestCenters.length > 0) {
                    if (now - lastForestSpawnTime > FOREST_SPAWN_INTERVAL_MS) {
                        activeForestCenters.forEach((center) => {
                            // Cull spawn if offscreen
                            if (center.x > viewLeft && center.x < viewRight) {
                                spawnOrbs(
                                    center.x,
                                    center.y,
                                    FOREST_SPAWN_AMOUNT,
                                    false,
                                );
                            }
                        });
                        lastForestSpawnTime = now;
                    }
                }

                if (
                    character.isBoost &&
                    !character.isTurbo &&
                    keys["shift"] &&
                    (keys["a"] || keys["d"] || keys["w"] || keys["s"])
                ) {
                    const elapsed = Date.now() - character.boostStartTime;
                    if (elapsed >= character.boostDuration) {
                        character.isBoost = false;
                        character.isTurbo = true;
                        character.turboFrameIndex = 0;
                        character.turboBoostFrameIndex = 0;
                    }
                }

                let baseSpeed =
                    character.isFloating ||
                    character.isFlyingUp ||
                    character.isFlyingDown
                        ? character.floatSpeed
                        : character.speed;
                const currentSpeed = character.isTurbo
                    ? baseSpeed * character.turboMultiplier
                    : character.isBoost
                      ? baseSpeed * character.boostMultiplier
                      : baseSpeed;

                let flyUpSpeed = character.flyUpSpeed,
                    flyDownSpeed = character.flyDownSpeed;
                if (character.isTurbo) {
                    flyUpSpeed = character.flyUpSpeedTurbo;
                    flyDownSpeed = character.flyDownSpeedTurbo;
                } else if (character.isBoost) {
                    flyUpSpeed = character.flyUpSpeedBoost;
                    flyDownSpeed = character.flyDownSpeedBoost;
                }

                worldObjects.sort((a, b) => a.depthLayer - b.depthLayer);

                for (let i = 0; i < worldObjects.length; i++) {
                    let obj = worldObjects[i];
                    obj.frameCounter++;
                    if (obj.frameCounter >= obj.frameDelay) {
                        obj.frameCounter = 0;
                        if (obj.state === "growing") {
                            obj.frameIndex++;
                            if (obj.frameIndex >= plantCount) {
                                obj.state = "grown";
                                obj.frameIndex = 0;
                                obj.frameDelay = 3;
                            }
                        } else if (obj.state === "growing-new-tree") {
                            obj.frameIndex++;
                            if (obj.frameIndex >= newTreeCount) {
                                obj.state = "grown-new-tree";
                                obj.frameIndex = 0;
                                obj.frameDelay = 3;
                            }
                        } else if (obj.state === "grown") {
                            obj.frameIndex = (obj.frameIndex + 1) % treeCount;
                        } else if (obj.state === "grown-new-tree") {
                            obj.frameIndex =
                                (obj.frameIndex + 1) % newTreeCount;
                        }
                    }
                    if (
                        obj.state === "grown" ||
                        obj.state === "grown-new-tree"
                    ) {
                        if (!obj.etherTimer) obj.etherTimer = now + 2000;
                        if (now > obj.etherTimer) {
                            const treeHeight = 200 * (obj.treeScale || 1);
                            spawnEther(obj.x, obj.y - treeHeight + 50);
                            const nextSpawn =
                                ETHER_SPAWN_RATE_MIN +
                                Math.random() *
                                    (ETHER_SPAWN_RATE_MAX -
                                        ETHER_SPAWN_RATE_MIN);
                            obj.etherTimer = now + nextSpawn;
                        }
                    }
                }

                let ignoreCollision =
                    character.isFlyingDown ||
                    character.isBoost ||
                    character.isTurbo;
                if (!ignoreCollision) {
                    let closestGroundY = -99999;
                    let foundGround = false;
                    const charFeetY = character.y + character.height;
                    const charCenterX = character.x + character.width / 2;

                    grounds.forEach((g) => {
                        let inHorizontalRange = true;
                        if (g.width) {
                            inHorizontalRange =
                                charCenterX >= g.x &&
                                charCenterX <= g.x + g.width;
                        }

                        if (
                            inHorizontalRange &&
                            charFeetY >= g.y &&
                            charFeetY - character.velocityY <= g.y + 10
                        ) {
                            if (g.y > closestGroundY) {
                                closestGroundY = g.y;
                                foundGround = true;
                            }
                        }
                    });
                    if (foundGround) character.groundY = closestGroundY;
                }

                if (character.isJumping) {
                    character.velocityY += character.gravity;
                    character.y += character.velocityY;
                    if (
                        !ignoreCollision &&
                        character.y + character.height >= character.groundY &&
                        character.velocityY > 0
                    ) {
                        character.y = character.groundY - character.height;
                        character.isJumping = false;
                        character.velocityY = 0;
                    }
                }
                if (character.isFlyingUp) {
                    character.y -= flyUpSpeed;
                } else if (character.isFlyingDown) {
                    character.y += flyDownSpeed;
                }
                if (character.isRaFloatingUp) {
                    character.y -= flyUpSpeed;
                    character.isMoving = true;
                } else if (character.isRaFloatingDown) {
                    character.y += flyDownSpeed;
                    character.isMoving = true;
                }
                if (
                    (character.isBoost || character.isTurbo) &&
                    !character.isFlyingUp &&
                    !character.isFlyingDown &&
                    !character.isRaFloatingUp &&
                    !character.isRaFloatingDown
                ) {
                    if (keys["w"]) {
                        character.y -= flyUpSpeed;
                    }
                    if (keys["s"]) {
                        character.y += flyDownSpeed;
                    }
                }
                if (character.isLanding) {
                    character.velocityY += character.gravity * 0.5;
                    character.y += character.velocityY;
                    if (
                        !ignoreCollision &&
                        character.y + character.height >= character.groundY
                    ) {
                        character.y = character.groundY - character.height;
                        character.velocityY = 0;
                    }
                }

                character.isMoving = false;
                if (!character.isGlowing) {
                    // Handle transformed character movement
                    if (character.isTransformed) {
                        if (
                            character.isRaFloating ||
                            character.isRaFloatingUp ||
                            character.isRaFloatingDown
                        ) {
                            if (
                                character.isRaFloating ||
                                character.isRaFloatingUp ||
                                character.isRaFloatingDown
                            ) {
                                // Ra Floating mode (idle) - can move in all directions, uses flying animation when moving
                                if (keys["a"]) {
                                    character.x -= currentSpeed * 1;
                                    character.direction = "left";
                                    character.isMoving = true;
                                    // Reset flying animation counter when moving horizontally
                                    if (character.isRaFloating) {
                                        character.raFlyingRightFrameIndex = 0;
                                        character.raFlyingRightFrameCounter = 0;
                                    }
                                }
                                if (keys["d"]) {
                                    character.x += currentSpeed * 1;
                                    character.direction = "right";
                                    character.isMoving = true;
                                    // Reset flying animation counter when moving horizontally
                                    if (character.isRaFloating) {
                                        character.raFlyingRightFrameIndex = 0;
                                        character.raFlyingRightFrameCounter = 0;
                                    }
                                }
                                // Handle W/S movement for all RaFloating states
                                if (keys["w"]) {
                                    character.y -= currentSpeed * 0.5;
                                    character.isMoving = true;
                                    // Reset flying animation counter when moving vertically
                                    if (character.isRaFloating) {
                                        character.raFlyingRightFrameIndex = 0;
                                        character.raFlyingRightFrameCounter = 0;
                                    }
                                }
                                if (keys["s"]) {
                                    character.y += currentSpeed * 0.5;
                                    character.isMoving = true;
                                    // Reset flying animation counter when moving vertically
                                    if (character.isRaFloating) {
                                        character.raFlyingRightFrameIndex = 0;
                                        character.raFlyingRightFrameCounter = 0;
                                    }
                                }
                            }
                        } else if (character.isRaFlyingRight) {
                            // Ra Flying Right mode: move based on keys
                            if (keys["a"]) {
                                character.x -= currentSpeed * 1.2;
                                character.direction = "left";
                                character.isMoving = true;
                            }
                            if (keys["d"]) {
                                character.x += currentSpeed * 1.2;
                                character.direction = "right";
                                character.isMoving = true;
                            }
                            if (keys["w"]) {
                                character.y -= currentSpeed * 0.3;
                            }
                            if (keys["s"]) {
                                character.y += currentSpeed * 0.3;
                            }
                        } else {
                            // Normal movement when transformed (ground walking)
                            if (keys["a"]) {
                                character.x -= currentSpeed;
                                character.direction = "left";
                                character.isMoving = true;
                            }
                            if (keys["d"]) {
                                character.x += currentSpeed;
                                character.direction = "right";
                                character.isMoving = true;
                            }
                            if (keys["w"]) {
                                character.y -= currentSpeed * 0.5;
                                character.isMoving = true;
                            }
                            if (keys["s"]) {
                                character.y += currentSpeed * 0.5;
                                character.isMoving = true;
                            }
                        }
                    } else {
                        // Normal character movement
                        if (keys["a"]) {
                            character.x -= currentSpeed;
                            character.direction = "left";
                            character.isMoving = true;
                        }
                        if (keys["d"]) {
                            character.x += currentSpeed;
                            character.direction = "right";
                            character.isMoving = true;
                        }
                        // W/S vertical movement in normal form (when in air)
                        if (
                            character.isFloating ||
                            character.isJumping ||
                            character.isFlyingUp ||
                            character.isFlyingDown
                        ) {
                            if (keys["w"]) {
                                character.y -= currentSpeed * 0.5;
                            }
                            if (keys["s"]) {
                                character.y += currentSpeed * 0.5;
                            }
                        }
                    }
                }

                const charCenterX = character.x + character.width / 2;
                const charCenterY = character.y + character.height / 2;

                // === FIND NEXT TARGET STAR ===
                const nextTargetStar = stars.find((s) => !s.found);

                for (let i = 0; i < stars.length; i++) {
                    let star = stars[i];
                    if (!star.found) {
                        const dist = Math.hypot(
                            charCenterX - star.x,
                            charCenterY - star.y,
                        );
                        if (dist < STAR_INTERACTION_RADIUS) {
                            star.found = true;
                            showToast(
                                `ANCIENT STAR ${star.id + 1} FOUND!`,
                                "star",
                            );
                            addFloatingText(
                                `STAR DISCOVERED!`,
                                star.x,
                                star.y - 50,
                                "#FFD700",
                            );
                            collectedEnergy += 100;
                            collectedEther += 50;
                        }
                    }
                }

                // === AUREL LEAD THE WAY LOGIC ===
                if (nextTargetStar) {
                    energyOrbs.forEach((orb) => {
                        if (orb.isAurel) {
                            const dx = nextTargetStar.x - orb.x;
                            const dy = nextTargetStar.y - orb.y;
                            const distToTarget = Math.hypot(dx, dy);

                            if (distToTarget > 10) {
                                orb.x += (dx / distToTarget) * 1.5;
                                orb.y += (dy / distToTarget) * 1.5;
                                orb.baseY = orb.y;
                            }
                        }
                    });
                }

                for (let i = geometricCores.length - 1; i >= 0; i--) {
                    let core = geometricCores[i];
                    core.y += Math.sin(now / 500 + core.floatOffset) * 0.5;
                    core.pulse += 0.05;

                    const dist = Math.hypot(
                        charCenterX - core.x,
                        charCenterY - core.y,
                    );
                    if (dist < 200) {
