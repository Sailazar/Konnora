                        core.x += (charCenterX - core.x) * 0.03;
                        core.y += (charCenterY - core.y) * 0.03;
                    }

                    if (dist < 60) {
                        collectedEther += 50;
                        addFloatingText(
                            `+50 ETHER`,
                            core.x,
                            core.y - 20,
                            "#E0B0FF",
                        );
                        geometricCores.splice(i, 1);
                    }
                }

                const handleMerge = (particles, type) => {
                    const len = particles.length;
                    if (len === 0) return;

                    for (let i = 0; i < len; i++) {
                        let pA = particles[i];
                        if (pA.isAurel) continue;

                        // Cull: Only find merges if on screen or close
                        if (pA.x < viewLeft - 2000 || pA.x > viewRight + 2000)
                            continue;

                        if (pA.mergeTarget) {
                            let pB = particles.find(
                                (o) => o.id === pA.mergeTarget,
                            );
                            if (pB && pB.isAurel) {
                                pA.mergeTarget = null;
                                pA.mergeStartTime = 0;
                                continue;
                            }
                            if (pB) {
                                let dist = Math.hypot(pA.x - pB.x, pA.y - pB.y);
                                if (dist < MERGE_DISTANCE) {
                                    if (!pA.mergeStartTime)
                                        pA.mergeStartTime = now;
                                    if (
                                        now - pA.mergeStartTime >
                                        MERGE_TIME_SEC * 1000
                                    ) {
                                        if (
                                            type === "ether" &&
                                            pA.value >= ATMOSPHERE_THRESHOLD
                                        ) {
                                            geometricCores.push({
                                                x: (pA.x + pB.x) / 2,
                                                y: (pA.y + pB.y) / 2,
                                                outerSize: 40,
                                                innerSize: 20,
                                                color: "#9D00FF",
                                                innerColor: "#D500F9",
                                                pulse: 0,
                                                floatOffset:
                                                    Math.random() * Math.PI * 2,
                                            });
                                            particles.splice(i, 1);
                                            const idxB = particles.indexOf(pB);
                                            if (idxB > -1) {
                                                particles.splice(idxB, 1);
                                                if (idxB < i) i--;
                                                return;
                                            }
                                            break;
                                        }
                                        pA.value += pB.value;
                                        pA.size =
                                            (type === "ether"
                                                ? ETHER_SIZE_BASE
                                                : 4) +
                                            pA.value * 2;
                                        pA.mergeTarget = null;
                                        pA.mergeStartTime = 0;
                                        const idxB = particles.indexOf(pB);
                                        if (idxB > -1) {
                                            particles.splice(idxB, 1);
                                            if (idxB < i) i--;
                                        }
                                    }
                                } else {
                                    pA.mergeTarget = null;
                                    pA.mergeStartTime = 0;
                                }
                            } else {
                                pA.mergeTarget = null;
                                pA.mergeStartTime = 0;
                            }
                        } else {
                            for (let j = i + 1; j < len; j++) {
                                let pB = particles[j];
                                if (!pB || pB.mergeTarget || pB.isAurel)
                                    continue;

                                let dist = Math.hypot(pA.x - pB.x, pA.y - pB.y);
                                if (dist < MERGE_DISTANCE) {
                                    pA.mergeTarget = pB.id;
                                    pA.mergeStartTime = now;
                                    break;
                                }
                            }
                        }
                    }
                };

                handleMerge(energyOrbs, "energy");
                handleMerge(etherPixels, "ether");

                // === ENERGY ORBS UPDATE (WITH CULLING) ===
                for (let i = energyOrbs.length - 1; i >= 0; i--) {
                    let orb = energyOrbs[i];
                    if (
                        orb.x < viewLeft - 500 ||
                        orb.x > viewRight + 500 ||
                        orb.y < viewTop - 500 ||
                        orb.y > viewBottom + 500
                    )
                        continue;

                    if (orb.mergeTarget) {
                        let target = energyOrbs.find(
                            (o) => o.id === orb.mergeTarget,
                        );
                        if (target) {
                            orb.x += (target.x - orb.x) * 0.02;
                            orb.y += (target.y - orb.y) * 0.02;
                        }
                    }
                    orb.x += orb.vx;
                    orb.angleOffset += orb.floatSpeed;
                    if (!orb.isAurel) {
                        orb.y = orb.baseY + Math.sin(orb.angleOffset) * 10;
                    }
                    const dist = Math.hypot(
                        charCenterX - orb.x,
                        charCenterY - orb.y,
                    );
                    if (dist < 100) {
                        orb.x += (charCenterX - orb.x) * 0.1;
                        orb.y += (charCenterY - orb.y) * 0.1;
                    }
                    if (dist < 40) {
                        if (orb.isAurel) {
                            collectedAurels += orb.value;
                            addFloatingText(
                                `+${orb.value} AUREL`,
                                orb.x,
                                orb.y - 10,
                                "#FFD700",
                            );
                        } else {
                            collectedEnergy += orb.value;
                            addFloatingText(
                                `+${orb.value} Energy`,
                                orb.x,
                                orb.y - 10,
                                "#00FFFF",
                            );
                        }
                        energyOrbs.splice(i, 1);
                    }
                }
                // ====================================

                // === ETHER PIXELS UPDATE (WITH CULLING) ===
                for (let i = etherPixels.length - 1; i >= 0; i--) {
                    let ether = etherPixels[i];
                    if (
                        ether.x < viewLeft - 500 ||
                        ether.x > viewRight + 500 ||
                        ether.y < viewTop - 500 ||
                        ether.y > viewBottom + 500
                    )
                        continue;

                    if (ether.mergeTarget) {
                        let target = etherPixels.find(
                            (o) => o.id === ether.mergeTarget,
                        );
                        if (target) {
                            ether.x += (target.x - ether.x) * 0.02;
                            ether.y += (target.y - ether.y) * 0.02;
                        }
                    }
                    ether.x += ether.vx;
                    ether.angleOffset += ether.floatSpeed;
                    ether.y = ether.baseY + Math.sin(ether.angleOffset) * 10;
                    const dist = Math.hypot(
                        charCenterX - ether.x,
                        charCenterY - ether.y,
                    );
                    if (dist < 60) {
                        ether.x += (charCenterX - ether.x) * 0.05;
                        ether.y += (charCenterY - ether.y) * 0.05;
                    }
                    if (dist < 35) {
                        collectedEther += ether.value;
                        if (Math.random() > 0.7)
                            addFloatingText(
                                `+${ether.value} Ether`,
                                ether.x,
                                ether.y - 10,
                                "#E0B0FF",
                            );
                        etherPixels.splice(i, 1);
                    }
                }
                // =========================================

                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    floatingTexts[i].y -= 0.5;
                    floatingTexts[i].life--;
                    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
                }

                if (character.isLanding) {
                    character.landFrameCounter++;
                    if (
                        character.landFrameCounter >= character.landFrameDelay
                    ) {
                        character.landFrameCounter = 0;
                        character.landFrameIndex++;
                        if (
                            character.landFrameIndex >= character.landFrameCount
                        ) {
                            character.isLanding = false;
                            character.landFrameIndex = 0;
                            character.velocityY = 0;
                            // Transition to KonnoRaIdle if transformed, otherwise normal idle
                            if (character.isTransformed) {
                                character.konnoRaIdleFrameIndex = 0;
                                character.konnoRaIdleFrameCounter = 0;
                            } else {
                                character.idleFrameIndex = 0;
                            }
                        }
                    }
                } else if (character.isTurbo) {
                    character.turboFrameCounter++;
                    if (
                        character.turboFrameCounter >= character.turboFrameDelay
                    ) {
                        character.turboFrameCounter = 0;
                        character.turboFrameIndex =
                            (character.turboFrameIndex + 1) %
                            character.turboFrameCount;
                    }
                    character.turboBoostCounter++;
                    if (
                        character.turboBoostCounter >=
                        character.turboBoostFrameDelay
                    ) {
                        character.turboBoostCounter = 0;
                        character.turboBoostFrameIndex =
                            (character.turboBoostFrameIndex + 1) %
                            character.turboBoostFrameCount;
                    }
                } else if (character.isBoost) {
                    character.boostFrameCounter++;
                    if (
                        character.boostFrameCounter >= character.boostFrameDelay
                    ) {
                        character.boostFrameCounter = 0;
                        character.boostFrameIndex =
                            (character.boostFrameIndex + 1) %
                            character.boostFrameCount;
                    }
                } else if (character.isFlyingDown) {
                    character.flyDownFrameCounter++;
                    if (
                        character.flyDownFrameCounter >=
                        character.flyDownFrameDelay
                    ) {
                        character.flyDownFrameCounter = 0;
                        character.flyDownFrameIndex =
                            (character.flyDownFrameIndex + 1) %
                            character.flyDownFrameCount;
                    }
                } else if (character.isFlyingUp) {
                    character.flyUpFrameCounter++;
                    if (
                        character.flyUpFrameCounter >= character.flyUpFrameDelay
                    ) {
                        character.flyUpFrameCounter = 0;
                        character.flyUpFrameIndex =
                            (character.flyUpFrameIndex + 1) %
                            character.flyUpFrameCount;
                    }
                } else if (character.isFloating) {
                    character.floatFrameCounter++;
                    if (
                        character.floatFrameCounter >= character.floatFrameDelay
                    ) {
                        character.floatFrameCounter = 0;
                        character.floatFrameIndex =
                            (character.floatFrameIndex + 1) %
                            character.floatFrameCount;
                    }
                } else if (character.isGlowing) {
                    character.glowingFrameCounter++;
                    if (
                        character.glowingFrameCounter >=
                        character.glowingFrameDelay
                    ) {
                        character.glowingFrameCounter = 0;
                        character.glowingFrameIndex++;
                        if (
                            character.glowingFrameIndex >=
                            character.glowingFrameCount
                        ) {
                            character.isGlowing = false;
                            character.glowingFrameIndex = 0;
                            character.idleFrameIndex = 0;
                            character.idleFrameCounter = 0;
                        }
                    }
                }

                // === TRANSFORMATION ANIMATION ===
                if (character.isTransforming) {
                    character.transformationFrameCounter++;
                    if (
                        character.transformationFrameCounter >=
                        character.transformationFrameDelay
                    ) {
                        character.transformationFrameCounter = 0;
                        if (
                            character.transformationFrameIndex <
                            character.transformFrameCount - 1
                        ) {
                            character.transformationFrameIndex++;
                        } else {
                            // Animation complete
                            character.isTransforming = false;
                            character.isTransformed = true;
                            character.transformationFrameIndex = 0;
                            character.transformationFrameCounter = 0;
                        }
                    }
                }

                // Update KonnoRa walking animation
                if (
                    character.isTransformed &&
                    character.isMoving &&
                    !character.isRaFloating &&
                    !character.isRaFloatingRight &&
                    !character.isRaFloatingUp &&
                    !character.isRaFloatingDown
                ) {
                    character.konnoRaWalkingFrameCounter++;
                    if (
                        character.konnoRaWalkingFrameCounter >=
                        character.konnoRaWalkingFrameDelay
                    ) {
                        character.konnoRaWalkingFrameCounter = 0;
                        character.konnoRaWalkingFrameIndex =
                            (character.konnoRaWalkingFrameIndex + 1) %
                            character.konnoRaWalkingFrameCount;
                    }
                } else if (character.isRaFloating) {
                    if (character.isMoving) {
                        character.raFlyingRightFrameCounter++;
                        if (
                            character.raFlyingRightFrameCounter >=
                            character.raFlyingRightFrameDelay
                        ) {
                            character.raFlyingRightFrameCounter = 0;
                            const rfLen = character.raFlyingRightFrames.length;
                            if (rfLen > 0) {
                                character.raFlyingRightFrameIndex =
                                    (character.raFlyingRightFrameIndex + 1) %
                                    rfLen;
                            }
                        }
                    } else {
                        character.raFloatingFrameCounter++;
                        if (
                            character.raFloatingFrameCounter >=
                            character.raFloatingFrameDelay
                        ) {
                            character.raFloatingFrameCounter = 0;
                            character.raFloatingFrameIndex =
                                (character.raFloatingFrameIndex + 1) %
                                character.raFloatingFrameCount;
                        }
                    }
                } else if (
                    character.isRaFloatingRight ||
                    character.isRaFloatingUp ||
                    character.isRaFloatingDown
                ) {
                    character.raFlyingRightFrameCounter++;
                    if (
                        character.raFlyingRightFrameCounter >=
                        character.raFlyingRightFrameDelay
                    ) {
                        character.raFlyingRightFrameCounter = 0;
                        const rfLen = character.raFlyingRightFrames.length;
                        if (rfLen > 0) {
                            character.raFlyingRightFrameIndex =
                                (character.raFlyingRightFrameIndex + 1) % rfLen;
                        }
                    }
                } else if (character.isSpreadingWings) {
                    character.spreadWingsFrameCounter++;
                    if (
                        character.spreadWingsFrameCounter >=
                        character.spreadWingsFrameDelay
                    ) {
                        character.spreadWingsFrameCounter = 0;
                        if (
                            character.spreadWingsFrameIndex <
                            character.spreadWingsFrameCount - 1
                        ) {
                            character.spreadWingsFrameIndex++;
                        } else {
                            character.isSpreadingWings = false;
                            character.spreadWingsFrameIndex = 0;
                        }
                    }
                } else if (character.isTransformed) {
                    character.konnoRaIdleFrameCounter++;
                    if (
                        character.konnoRaIdleFrameCounter >=
                        character.konnoRaIdleFrameDelay
                    ) {
                        character.konnoRaIdleFrameCounter = 0;
                        character.konnoRaIdleFrameIndex =
                            (character.konnoRaIdleFrameIndex + 1) %
                            character.konnoRaIdleFrameCount;
                    }
                }

                if (character.isJumping) {
                    character.jumpFrameCounter++;
                    if (
                        character.jumpFrameCounter >= character.jumpFrameDelay
                    ) {
                        character.jumpFrameCounter = 0;
                        if (
                            character.jumpFrameIndex <
                            character.jumpFrameCount - 1
                        )
                            character.jumpFrameIndex++;
                    }
                } else if (character.isMoving) {
                    character.walkFrameCounter++;
                    if (
                        character.walkFrameCounter >= character.walkFrameDelay
                    ) {
                        character.walkFrameCounter = 0;
                        character.walkFrameIndex =
                            (character.walkFrameIndex + 1) %
                            character.walkFrameCount;
                    }
                } else {
                    character.idleFrameCounter++;
                    if (
                        character.idleFrameCounter >= character.idleFrameDelay
                    ) {
                        character.idleFrameCounter = 0;
                        character.idleFrameIndex =
                            (character.idleFrameIndex + 1) %
                            character.idleFrameCount;
                    }
                }

                particleLayer.frameCounter++;
                if (particleLayer.frameCounter >= particleLayer.frameDelay) {
                    particleLayer.frameCounter = 0;
                    particleLayer.frameIndex =
                        (particleLayer.frameIndex + 1) % particleCount;
                }
                background.frameCounter++;
                if (background.frameCounter >= background.frameDelay) {
                    background.frameCounter = 0;
                    background.frameIndex =
                        (background.frameIndex + 1) % background.frameCount;
                }
                treeLayer.frameCounter++;
                if (treeLayer.frameCounter >= treeLayer.frameDelay) {
                    treeLayer.frameCounter = 0;
                    treeLayer.frameIndex =
                        (treeLayer.frameIndex + 1) % treeLayer.frameCount;
                }
                newBackgroundLayer.frameCounter++;
                if (
                    newBackgroundLayer.frameCounter >=
                    newBackgroundLayer.frameDelay
                ) {
                    newBackgroundLayer.frameCounter = 0;
                    newBackgroundLayer.frameIndex =
                        (newBackgroundLayer.frameIndex + 1) %
                        newBackgroundLayer.frameCount;
                }
                newBackground2Layer.frameCounter++;
                if (
                    newBackground2Layer.frameCounter >=
                    newBackground2Layer.frameDelay
                ) {
                    newBackground2Layer.frameCounter = 0;
                    newBackground2Layer.frameIndex =
                        (newBackground2Layer.frameIndex + 1) %
                        newBackground2Layer.frameCount;
                }
            }

            function drawTiledLayer(layer) {
                const img = layer.frames[layer.frameIndex];
                if (!img || !img.complete || img.naturalHeight === 0) return;
                const tileW = img.naturalWidth * layer.scale;
                const tileH = canvas.height;
                const worldOffset = character.x * layer.parallaxFactor;
                const offsetX = -(worldOffset % tileW);
                let startX = offsetX - tileW;
                const count = Math.ceil(canvas.width / tileW) + 2;
                for (let i = 0; i < count; i++)
                    ctx.drawImage(img, startX + i * tileW, 0, tileW, tileH);
            }

            const drawParallax = (layer, scale = 1, parallaxFactor = 1) => {
                const img = layer.frames[layer.frameIndex];
                if (img && img.complete && img.naturalHeight !== 0) {
                    const w = canvas.width * scale,
                        h = canvas.height * scale;
                    const offsetX = -(character.x * parallaxFactor) % w;
                    const drawX = offsetX < 0 ? offsetX + w : offsetX;
                    for (let dx = -2; dx <= 2; dx++)
                        ctx.drawImage(img, drawX + dx * w, 0, w, h);
                }
            };

            const drawStaticLeft = (layer, scale = 1) => {
                const img = layer.frames[layer.frameIndex];
                if (img && img.complete && img.naturalHeight !== 0) {
                    const w = canvas.width * scale,
                        h = canvas.height * scale;
                    ctx.drawImage(img, 0, 0, w, h);
                }
            };

            function drawPixelStar(
                ctx,
                x,
                y,
                size,
                color,
                alpha,
                pulse,
                isFound,
                isForestActivated,
            ) {
                ctx.save();
                ctx.translate(x, y);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = color;

                if (isFound) {
                    // === ENHANCED BRIGHT GLOW FOR ACTIVATED STARS ===

                    // Outer large pulsing halo
                    const outerHaloSize =
                        size * 6 + Math.sin(Date.now() / 200) * 8;
                    ctx.fillStyle = "rgba(255, 215, 0, 0.03)";
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(0, 0, outerHaloSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Medium pulsing halo
                    const mediumHaloSize =
                        size * 4 + Math.sin(Date.now() / 250) * 6;
                    ctx.fillStyle = "rgba(255, 215, 0, 0.05)";
                    ctx.beginPath();
                    ctx.arc(0, 0, mediumHaloSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner bright halo
                    const innerHaloSize =
                        size * 2.5 + Math.sin(Date.now() / 300) * 4;
                    ctx.fillStyle = "rgba(255, 255, 200, 0.1)";
                    ctx.beginPath();
                    ctx.arc(0, 0, innerHaloSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Bright rays emanating from star
                    ctx.save();
                    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 150) * 0.2;
                    ctx.fillStyle = "#FFFFAA";
                    ctx.shadowColor = "#FFFFFF";
                    ctx.shadowBlur = 20;

                    for (let i = 0; i < 8; i++) {
                        const angle =
                            (Date.now() / 1000 + (i * Math.PI) / 4) %
                            (Math.PI * 2);
                        const rayLen =
                            size * 3 + Math.sin(Date.now() / 200 + i) * size;
                        const rayWidth = 2 + Math.sin(Date.now() / 100 + i) * 1;

                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(
                            Math.cos(angle) * rayLen,
                            Math.sin(angle) * rayLen,
                        );
                        ctx.lineWidth = rayWidth;
                        ctx.strokeStyle = "#FFFFFF";
                        ctx.stroke();
                    }
                    ctx.restore();

                    // Intense core glow
                    ctx.shadowColor = "#FFFFFF";
                    ctx.shadowBlur = 30 + pulse * 10;
                } else {
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 8 + pulse * 2;
                }

                ctx.fillRect(-size / 2, -size / 2, size, size);

                const tipLen = size * 2;
                const tipW = size * 0.4;
                ctx.fillRect(-tipLen / 2, -tipW / 2, tipLen, tipW);
                ctx.fillRect(-tipW / 2, -tipLen / 2, tipW, tipLen);

                // Brighter center for activated stars
                if (isFound) {
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(
                        -size / 3,
                        -size / 3,
                        size * 0.66,
                        size * 0.66,
                    );
                } else {
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(-1, -1, 2, 2);
                }

                // Forest activation indicator - green glow overlay
                if (isForestActivated) {
                    ctx.globalCompositeOperation = "source-over";
                    ctx.fillStyle = `rgba(0, 255, 128, ${0.3 + Math.sin(Date.now() / 300) * 0.1})`;
                    ctx.shadowColor = "#00FF80";
                    ctx.shadowBlur = 20;

                    // Green pulsing ring around star
                    const ringSize =
                        size * 2.5 + Math.sin(Date.now() / 250) * 5;
                    ctx.beginPath();
                    ctx.arc(0, 0, ringSize, 0, Math.PI * 2);
                    ctx.strokeStyle = "rgba(0, 255, 128, 0.5)";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.restore();
            }

            function drawMiniMap() {
                const mapX = canvas.width - 210;
                const mapY = 20;
                const mapW = 200;
                const mapH = 200;
                const scale = 0.05;

                ctx.save();

                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(mapX, mapY, mapW, mapH);
                ctx.strokeStyle = "#FFD700";
                ctx.lineWidth = 2;
                ctx.strokeRect(mapX, mapY, mapW, mapH);

                ctx.translate(mapX + mapW / 2, mapY + mapH / 2);

                activeForestCenters.forEach((center) => {
                    const relX = center.x - character.x;
                    const relY = center.y - character.y;
                    const drawX = relX * scale;
                    const drawY = relY * scale;
                    const radius = Math.sqrt(drawX * drawX + drawY * drawY);
                    const maxRadius = mapW / 2 - 10;

                    if (radius < maxRadius) {
                        ctx.fillStyle = "rgba(255, 215, 0, 0.3)";
                        ctx.beginPath();
                        ctx.arc(drawX, drawY, 20, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#FFD700";
                        ctx.beginPath();
                        ctx.arc(drawX, drawY, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        const angle = Math.atan2(relY, relX);
                        const arrowLen = maxRadius - 5;
                        ctx.save();
                        ctx.rotate(angle);
                        ctx.translate(arrowLen, 0);
                        ctx.fillStyle = "#FFD700";
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(-5, -5);
                        ctx.lineTo(-5, 5);
                        ctx.fill();
                        ctx.restore();
                    }
                });

                const foundStars = stars
                    .filter((s) => s.found)
                    .sort((a, b) => a.id - b.id);
                if (foundStars.length > 1) {
                    ctx.save();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
                    ctx.lineWidth = 1;
                    ctx.shadowColor = "transparent";
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    const startX = (foundStars[0].x - character.x) * scale;
                    const startY = (foundStars[0].y - character.y) * scale;
                    ctx.moveTo(startX, startY);
                    for (let i = 1; i < foundStars.length; i++) {
                        const drawX = (foundStars[i].x - character.x) * scale;
                        const drawY = (foundStars[i].y - character.y) * scale;
                        ctx.lineTo(drawX, drawY);
                    }
                    ctx.stroke();
                    ctx.restore();
                }

                stars.forEach((star) => {
                    if (star.found) {
                        const relX = star.x - character.x;
                        const relY = star.y - character.y;
                        const drawX = relX * scale;
                        const drawY = relY * scale;
                        const radius = Math.sqrt(drawX * drawX + drawY * drawY);
                        const maxRadius = mapW / 2 - 5;

                        if (radius < maxRadius) {
                            ctx.fillStyle = "#FFFFFF";
                            ctx.beginPath();
                            ctx.moveTo(drawX - 4, drawY);
                            ctx.lineTo(drawX + 4, drawY);
                            ctx.moveTo(drawX, drawY - 4);
                            ctx.lineTo(drawX, drawY + 4);
                            ctx.stroke();

                            ctx.shadowColor = "#FFFFFF";
                            ctx.shadowBlur = 5;
                            ctx.fillRect(drawX - 2, drawY - 2, 4, 4);
                        } else {
                            const angle = Math.atan2(relY, relX);
                            const arrowLen = maxRadius - 2;
                            ctx.save();
                            ctx.rotate(angle);
                            ctx.translate(arrowLen, 0);
                            ctx.strokeStyle = "#FFFFFF";
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.lineTo(-3, -3);
                            ctx.lineTo(-3, 3);
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                });

                ctx.fillStyle = "#00FFFF";
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                if (character.direction === "left") ctx.rotate(Math.PI);
                else ctx.rotate(0);

                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(0, -5);
                ctx.lineTo(0, 5);
                ctx.closePath();
                ctx.fillStyle = "#00FFFF";
                ctx.fill();

                ctx.restore();

                ctx.fillStyle = "#AAA";
                ctx.font = "bold 12px Courier New";
                ctx.fillText("RADAR", -20, -mapH / 2 + 15);

                ctx.restore();
            }

            function draw() {
                ctx.fillStyle = "#0a0a0a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);

                ctx.translate(cameraOffsetX, cameraOffsetY);
                ctx.scale(zoom, zoom);
                ctx.translate(
                    -character.x - character.width / 2,
                    -character.y - character.height / 2,
                );

                drawTiledLayer(particleLayer);
                drawParallax(background, 1, 0.05);
                drawParallax(treeLayer, 1.5, 0.15);

                grounds.forEach((g) => {
                    if (g.type === "particle") {
                        const img =
                            particleLayer.frames[particleLayer.frameIndex];
                        if (img && img.complete) {
                            const tileW = img.naturalWidth;
                            const tileH = img.naturalHeight;
                            if (g.width) {
                                const drawY = g.y - tileH / 2;
                                const startTile = Math.floor(g.x / tileW);
                                const endTile = Math.ceil(
                                    (g.x + g.width) / tileW,
                                );
                                for (let t = startTile; t <= endTile; t++) {
                                    const xPos = t * tileW;
                                    ctx.drawImage(
                                        img,
                                        xPos,
                                        drawY,
                                        tileW,
                                        tileH,
                                    );
                                }
                            } else {
                                const count =
                                    Math.ceil(canvas.width / tileW) + 2;
                                const offsetX = -(character.x % tileW) - tileW;
                                ctx.save();
                                ctx.translate(0, g.y - tileH / 2);
                                for (let i = 0; i < count; i++)
                                    ctx.drawImage(
                                        img,
                                        offsetX + i * tileW,
                                        0,
                                        tileW,
                                        tileH,
                                    );
                                ctx.restore();
                            }
                        }
                    }
                });

                const now = Date.now();

                // === CULLING BOUNDS FOR DRAWING ===
                const viewPaddingDraw = 500;
                const viewLeft =
                    character.x - canvas.width / zoom - viewPaddingDraw;
                const viewRight =
                    character.x + canvas.width / zoom + viewPaddingDraw;
                const viewTop =
                    character.y - canvas.height / zoom - viewPaddingDraw;
                const viewBottom =
                    character.y + canvas.height / zoom + viewPaddingDraw;
                // =====================================

                // === CONSTELLATION LINES (MAIN GAME) ===
                const foundStars = stars
                    .filter((s) => s.found)
                    .sort((a, b) => a.id - b.id);
                if (foundStars.length > 1) {
                    ctx.save();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    ctx.moveTo(foundStars[0].x, foundStars[0].y);
                    for (let i = 1; i < foundStars.length; i++) {
                        ctx.lineTo(foundStars[i].x, foundStars[i].y);
                    }
                    ctx.stroke();
                    ctx.restore();
                }
                // ========================================

                stars.forEach((star) => {
                    // Draw Star if visible
                    if (
                        star.x < viewLeft - 500 ||
                        star.x > viewRight + 500 ||
                        star.y < viewTop - 500 ||
                        star.y > viewBottom + 500
                    )
                        return;

                    const dist = Math.hypot(
                        character.x - star.x,
                        character.y - star.y,
                    );
                    let alpha = 0;

                    if (star.found) {
                        alpha = 1;
                    } else if (dist < STAR_VISIBILITY_RANGE) {
                        alpha = 1 - dist / STAR_VISIBILITY_RANGE;
                    }

                    if (alpha > 0) {
                        const pulse = Math.sin(now / 200 + star.pulseOffset);
                        const baseSize = 10 * star.sizeVariation;

                        drawPixelStar(
                            ctx,
                            star.x,
                            star.y,
                            baseSize,
                            star.colorVar,
                            alpha,
                            pulse,
                            star.found,
                            star.forestActivated,
                        );

                        if (!star.found && dist < 300 && dist > 100) {
                            if (Math.floor(now / 1000) % 2 === 0) {
                                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                                ctx.font = "12px Courier New";
                                ctx.textAlign = "center";
                                ctx.fillText("?", star.x, star.y - 40);
                            }
                        }
                    }
                });

                // === DRAW STAR AURELS (Floating to center) ===
                for (let i = 0; i < starAurels.length; i++) {
                    const aurel = starAurels[i];
                    // Culling check
                    if (
                        aurel.x < viewLeft - 500 ||
                        aurel.x > viewRight + 500 ||
                        aurel.y < viewTop - 500 ||
                        aurel.y > viewBottom + 500
                    )
                        continue;

                    const pulse = Math.sin(now / 200 + aurel.pulseOffset);
                    const drawSize = aurel.size + pulse * 2;

                    ctx.save();
                    ctx.translate(aurel.x, aurel.y);

                    // Golden glow
                    ctx.shadowColor = "#FFD700";
                    ctx.shadowBlur = 15;

                    // Draw aurel particle
                    ctx.fillStyle = aurel.color;
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.arc(0, 0, drawSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner bright core
                    ctx.fillStyle = "#FFFFFF";
                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.arc(0, 0, drawSize * 0.4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }

                // === DRAW SUN CIRCLE (Yellow-white glowing sun) ===
                if (sunCircle) {
                    ctx.save();
                    ctx.translate(sunCircle.x, sunCircle.y);

                    const pulse = Math.sin(sunCircle.pulseOffset * 2) * 0.1;
                    const currentRadius = sunCircle.radius * (1 + pulse);

                    ctx.globalAlpha = sunCircle.alpha;

                    // Outer large yellow glow
                    const outerGlowSize = currentRadius * 3;
                    const gradient = ctx.createRadialGradient(
                        0,
                        0,
                        currentRadius,
                        0,
                        0,
                        outerGlowSize,
                    );
                    gradient.addColorStop(0, "rgba(255, 255, 200, 0.3)");
                    gradient.addColorStop(0.5, "rgba(255, 215, 0, 0.15)");
                    gradient.addColorStop(1, "rgba(255, 140, 0, 0)");

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, outerGlowSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Medium white-gold halo
                    const mediumHaloSize = currentRadius * 2;
                    ctx.shadowColor = "#FFD700";
                    ctx.shadowBlur = 50;
                    ctx.fillStyle = "rgba(255, 255, 220, 0.4)";
                    ctx.beginPath();
                    ctx.arc(0, 0, mediumHaloSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner bright sun core
                    ctx.shadowColor = "#FFFFFF";
                    ctx.shadowBlur = 80;
                    const coreGradient = ctx.createRadialGradient(
                        0,
                        0,
                        0,
                        0,
                        0,
                        currentRadius,
                    );
                    coreGradient.addColorStop(0, "#FFFFFF");
                    coreGradient.addColorStop(0.3, "#FFFFAA");
                    coreGradient.addColorStop(0.7, "#FFD700");
                    coreGradient.addColorStop(1, "#FFA500");

                    ctx.fillStyle = coreGradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // Bright center hotspot
                    ctx.fillStyle = "#FFFFFF";
                    ctx.shadowBlur = 100;
                    ctx.beginPath();
                    ctx.arc(0, 0, currentRadius * 0.4, 0, Math.PI * 2);
                    ctx.fill();

                    // Radiating rays effect
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 12; i++) {
                        const angle =
                            (i * Math.PI) / 6 + sunCircle.pulseOffset * 0.5;
                        const innerR = currentRadius * 1.1;
                        const outerR =
                            currentRadius * 1.8 +
                            Math.sin(sunCircle.pulseOffset * 3 + i) * 20;

                        ctx.beginPath();
                        ctx.moveTo(
                            Math.cos(angle) * innerR,
                            Math.sin(angle) * innerR,
                        );
                        ctx.lineTo(
                            Math.cos(angle) * outerR,
                            Math.sin(angle) * outerR,
                        );
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                // === DRAW ENERGY ORBS (CULLED) ===
                for (let i = 0; i < energyOrbs.length; i++) {
                    let orb = energyOrbs[i];
                    // Culling check
                    if (
                        orb.x < viewLeft - 500 ||
                        orb.x > viewRight + 500 ||
                        orb.y < viewTop - 500 ||
                        orb.y > viewBottom + 500
                    )
                        continue;

                    if (orb.mergeTarget) {
                        const target = energyOrbs.find(
                            (o) => o.id === orb.mergeTarget,
                        );
                        if (target) {
                            ctx.save();
                            ctx.strokeStyle = orb.color;
                            ctx.globalAlpha = 0.5;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(orb.x, orb.y);
                            ctx.lineTo(target.x, target.y);
                            ctx.stroke();
                            ctx.restore();
                        }
                    }
                    ctx.save();
                    ctx.shadowColor = orb.color;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = orb.color;
                    const jitterX = (Math.random() - 0.5) * orb.pixelJitter;
                    const jitterY = (Math.random() - 0.5) * orb.pixelJitter;
                    const drawSize = orb.size;

                    if (orb.isAurel) {
                        ctx.beginPath();
                        ctx.moveTo(orb.x + jitterX, orb.y + jitterY - drawSize);
                        ctx.lineTo(orb.x + jitterX + drawSize, orb.y + jitterY);
                        ctx.lineTo(orb.x + jitterX, orb.y + jitterY + drawSize);
                        ctx.lineTo(orb.x + jitterX - drawSize, orb.y + jitterY);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = "#FFF";
                        ctx.fillRect(
                            orb.x + jitterX - 1,
                            orb.y + jitterY - 1,
                            2,
                            2,
                        );
                    } else {
                        ctx.fillRect(
                            orb.x + jitterX - drawSize / 2,
                            orb.y + jitterY - drawSize / 2,
                            drawSize,
                            drawSize,
                        );
                    }

                    if (orb.value > 1) {
                        ctx.fillStyle = "#000";
                        ctx.font = "10px Arial";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(
                            orb.value,
                            orb.x + jitterX,
                            orb.y + jitterY,
                        );
                    }
                    if (!orb.isAurel && Math.random() > 0.7) {
                        ctx.globalAlpha = 0.6;
                        ctx.fillRect(
                            orb.x + jitterX - drawSize,
                            orb.y + jitterY - drawSize,
                            drawSize / 2,
                            drawSize / 2,
                        );
                    }
                    ctx.restore();
                }
                // =======================================

                // === DRAW ETHER PIXELS (CULLED) ===
                for (let i = 0; i < etherPixels.length; i++) {
                    let ether = etherPixels[i];
                    if (
                        ether.x < viewLeft - 500 ||
                        ether.x > viewRight + 500 ||
                        ether.y < viewTop - 500 ||
                        ether.y > viewBottom + 500
                    )
                        continue;

                    if (ether.mergeTarget) {
                        const target = etherPixels.find(
                            (o) => o.id === ether.mergeTarget,
                        );
                        if (target) {
                            ctx.save();
                            ctx.strokeStyle = ether.color;
                            ctx.globalAlpha = 0.5;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(ether.x, ether.y);
                            ctx.lineTo(target.x, target.y);
                            ctx.stroke();
                            ctx.restore();
                        }
                    }
                    ctx.save();
                    ctx.shadowColor = ether.color;
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = ether.color;
                    const jitterX = (Math.random() - 0.5) * ether.pixelJitter;
                    const jitterY = (Math.random() - 0.5) * ether.pixelJitter;
                    const drawSize = ether.size;
                    ctx.fillRect(
                        ether.x + jitterX - drawSize / 2,
                        ether.y + jitterY - drawSize / 2,
                        drawSize,
                        drawSize,
                    );
                    if (ether.value > 1) {
                        ctx.fillStyle = "#FFF";
                        ctx.font = "10px Arial";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(
                            ether.value,
                            ether.x + jitterX,
                            ether.y + jitterY,
                        );
                    }
                    if (Math.random() > 0.8) {
                        ctx.globalAlpha = 0.8;
                        ctx.fillStyle = "#FFFFFF";
                        ctx.fillRect(
                            ether.x + jitterX,
                            ether.y + jitterY,
                            1,
                            1,
                        );
                    }
                    ctx.restore();
                }
                // =========================================

                geometricCores.forEach((core) => {
                    // Cull Cores
                    if (
                        core.x < viewLeft - 500 ||
                        core.x > viewRight + 500 ||
                        core.y < viewTop - 500 ||
                        core.y > viewBottom + 500
                    )
                        return;

                    ctx.save();
                    ctx.translate(core.x, core.y);
                    const scale = 1 + Math.sin(core.pulse) * 0.1;
                    ctx.scale(scale, scale);
                    ctx.fillStyle = core.color;
                    ctx.shadowColor = core.color;
                    ctx.shadowBlur = 15;
                    ctx.fillRect(
                        -core.outerSize / 2,
                        -core.outerSize / 2,
                        core.outerSize,
                        core.outerSize,
                    );
                    ctx.fillStyle = core.innerColor;
                    ctx.shadowBlur = 5;
                    ctx.fillRect(
                        -core.innerSize / 2,
                        -core.innerSize / 2,
                        core.innerSize,
                        core.innerSize,
                    );
                    ctx.restore();
                });

                if (character.isTurbo) {
                    const pivotX =
                        character.x + character.width / 2 + turboCharOffsetX;
                    const pivotY =
                        character.y + character.height / 2 + turboCharOffsetY;
                    const facingRight = character.direction === "right";
                    const scaleX = facingRight ? 1 : -1;

                    ctx.save();
                    ctx.translate(pivotX, pivotY);
                    ctx.scale(scaleX, 1);

                    const tailImg =
                        character.turboBoostFrames[
                            character.turboBoostFrameIndex
                        ];
                    if (
                        tailImg &&
                        tailImg.complete &&
                        tailImg.naturalHeight !== 0
                    ) {
                        const tailW = character.width * turboBoostWidthScale;
                        const tailH = character.height * turboBoostHeightScale;
                        ctx.save();
                        ctx.rotate(turboBoostRotationAngle * (Math.PI / 180));
                        ctx.drawImage(
                            tailImg,
                            -tailW / 2 + turboBoostOffsetX,
                            -tailH / 2 + turboBoostOffsetY,
                            tailW,
                            tailH,
                        );
                        ctx.restore();
                    } else {
                        ctx.fillStyle = "orange";
                        ctx.fillRect(-100 - 303, -20, 100, 40);
                    }

                    const bodyImg =
                        character.turboFrames[character.turboFrameIndex];
                    if (
                        bodyImg &&
                        bodyImg.complete &&
                        bodyImg.naturalHeight !== 0
                    ) {
                        const bodyW = character.width * turboCharWidthScale;
                        const bodyH = character.height * turboCharHeightScale;
                        ctx.save();
                        ctx.rotate(turboCharRotationAngle * (Math.PI / 180));
                        ctx.drawImage(
                            bodyImg,
                            -bodyW / 2,
                            -bodyH / 2,
                            bodyW,
                            bodyH,
                        );
                        ctx.restore();
                    } else {
                        ctx.fillStyle = "#FF0000";
                        ctx.fillRect(
                            -character.width / 2,
                            -character.height / 2,
                            character.width,
                            character.height,
                        );
                    }
                    ctx.restore();
                }

                let img;
                if (character.isTransforming)
                    img =
                        character.transformFrames[
                            character.transformationFrameIndex
                        ];
                else if (character.isSpreadingWings)
                    img =
                        character.spreadWingsFrames[
                            character.spreadWingsFrameIndex
                        ];
                else if (character.isTransformed) {
                    if (character.isRaFloating) {
                        // Use flying animation when moving, idle animation when not
                        if (character.isMoving) {
                            const rfLen = character.raFlyingRightFrames.length;
                            img =
                                rfLen > 0
                                    ? character.raFlyingRightFrames[
                                          character.raFlyingRightFrameIndex %
                                              rfLen
                                      ]
                                    : null;
                        } else
                            img =
                                character.raFloatingFrames &&
                                character.raFloatingFrames.length > 0
                                    ? character.raFloatingFrames[
                                          character.raFloatingFrameIndex %
                                              character.raFloatingFrames.length
                                      ]
                                    : null;
                    } else if (
                        character.isRaFloatingRight ||
                        character.isRaFloatingUp ||
                        character.isRaFloatingDown
                    ) {
                        // Use flying animation
                        const raFloatingRightFrame =
                            character.raFlyingRightFrames &&
                            character.raFlyingRightFrames.length > 0
                                ? character.raFlyingRightFrames[
                                      character.raFlyingRightFrameIndex %
                                          character.raFlyingRightFrames.length
                                  ]
                                : null;

                        if (
                            raFloatingRightFrame &&
                            raFloatingRightFrame.complete &&
                            raFloatingRightFrame.naturalHeight !== 0
                        )
                            img = raFloatingRightFrame;
                        else
                            img =
                                character.raFlyingFrames &&
                                character.raFlyingFrames.length > 0
                                    ? character.raFlyingFrames[
                                          character.raFlyingFrameIndex %
                                              character.raFlyingFrames.length
                                      ]
                                    : null;
                    } else if (character.isMoving)
                        img =
                            character.konnoRaWalkingFrames &&
                            character.konnoRaWalkingFrames.length > 0
                                ? character.konnoRaWalkingFrames[
                                      character.konnoRaWalkingFrameIndex %
                                          character.konnoRaWalkingFrames.length
                                  ]
                                : null;
                    else if (character.isLanding)
                        img = character.landFrames[character.landFrameIndex];
                    else
                        img =
                            character.konnoRaIdleFrames[
                                character.konnoRaIdleFrameIndex
                            ];
                } else if (character.isLanding)
                    img = character.landFrames[character.landFrameIndex];
                else if (character.isTurbo) {
                    /* Handled above */
                } else if (character.isBoost)
                    img = character.boostFrames[character.boostFrameIndex];
                else if (character.isFlyingDown)
                    img = character.flyDownFrames[character.flyDownFrameIndex];
                else if (character.isFlyingUp)
                    img = character.flyUpFrames[character.flyUpFrameIndex];
                else if (character.isFloating)
                    img = character.floatFrames[character.floatFrameIndex];
                else if (character.isGlowing)
                    img = character.glowingFrames[character.glowingFrameIndex];
                else if (character.isJumping)
                    img = character.jumpFrames[character.jumpFrameIndex];
                else if (character.isMoving)
                    img = character.walkFrames[character.walkFrameIndex];
                else img = character.idleFrames[character.idleFrameIndex];

                if (!character.isTurbo && img) {
                    if (img.complete && img.naturalHeight !== 0) {
                        const w = character.width;
                        const h = character.height;
                        const x = character.x;
                        const y = character.y;
                        ctx.save();
                        ctx.translate(x + w / 2, y + h / 2);
                        if (collectedEnergy > 0) {
                            const pulse = Math.sin(Date.now() / 200) * 5;
                            const auraIntensity =
                                Math.min(collectedEnergy * 3, 80) + pulse;
                            ctx.shadowColor =
                                collectedEnergy >= ENERGY_COST_TO_PLANT
                                    ? "#FFD700"
                                    : "#00FFFF";
                            ctx.shadowBlur = Math.max(10, auraIntensity);
                        }
                        if (character.isTransforming) {
                            ctx.scale(-1, 1);
                            // Transforming - no flip needed
                        } else if (character.isRaFloating) {
                            // Ra Floating - flip based on direction
                            if (character.direction === "left")
                                ctx.scale(-1, 1);
                        } else if (character.isRaFlyingRight) {
                            // Ra Flying Right - flip based on direction
                            if (character.direction === "left")
                                ctx.scale(-1, 1);
                        } else if (
                            character.isTransformed &&
                            character.isMoving
                        ) {
                            // KonnoRaWalking - flip when moving right
                            if (character.direction === "left")
                                ctx.scale(-1, 1);
                        } else if (
                            character.isLanding &&
                            character.isTransformed
                        ) {
                            // Landing while transformed - flip to match KonnoRaIdle direction
                            if (character.direction === "right")
                                ctx.scale(-1, 1);
                        } else if (character.isTransformed) {
                            // KonnoRaIdle - flip based on direction
                            if (character.direction === "left")
                                ctx.scale(-1, 1);
                        } else if (character.isBoost) {
                            // Boost - flip when moving left
                            if (character.direction === "left")
                                ctx.scale(-1, 1);
                        } else {
                            // Normal character - flip when moving right
                            if (character.direction === "right")
                                ctx.scale(-1, 1);
                        }
                        ctx.drawImage(img, -w / 2, -h / 2, w, h);
                        ctx.restore();
                    } else {
                        const colors = [
                            "#4CAF50",
                            "#4CAF50",
                            "#FF5722",
                            "#FFD700",
                            "#00BFFF",
                            "#E91E63",
                            "#FF6F00",
                            "#FFFF00",
                            "#00FF00",
                            "#9C27B0",
                        ];
                        const states = [
                            0,
                            character.isMoving,
                            character.isJumping,
                            character.isGlowing,
                            character.isFloating,
                            character.isFlyingUp,
                            character.isFlyingDown,
                            character.isBoost,
                            character.isTurbo,
                            character.isLanding,
                        ];
                        ctx.fillStyle = colors[states.indexOf(true)];
                        ctx.fillRect(
                            character.x,
                            character.y,
                            character.width,
                            character.height,
                        );
                        ctx.fillStyle = "#fff";
                        ctx.beginPath();
                        const eyeX =
                            character.direction === "left"
                                ? character.x + 38
                                : character.x + 90;
                        ctx.arc(eyeX, character.y + 20, 8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // === DRAW WORLD OBJECTS (TREES) CULLED ===
                for (let i = 0; i < worldObjects.length; i++) {
                    let obj = worldObjects[i];
                    if (obj.x > viewLeft - 200 && obj.x < viewRight + 200) {
                        let tImg;
                        let scale;
                        if (obj.state === "growing") {
                            tImg = plantFrames[obj.frameIndex];
                            scale = obj.plantScale || 1.0;
                        } else if (obj.state === "growing-new-tree") {
                            tImg = newTreeFrames[obj.frameIndex];
                            scale = obj.treeScale || 1.0;
                        } else if (obj.state === "grown-new-tree") {
                            tImg = newTreeFrames[obj.frameIndex];
                            scale = obj.treeScale || 1.0;
                        } else {
                            tImg = treeLayer.frames[obj.frameIndex];
                            scale = obj.treeScale || 1.0;
                        }

                        let inActiveForest = false;

                        if (
                            activeForestCenters.length > 0 &&
                            (obj.state === "grown" ||
                                obj.state === "grown-new-tree")
                        ) {
                            for (
                                let c = 0;
                                c < activeForestCenters.length;
                                c++
                            ) {
                                const distToCenter = Math.hypot(
                                    obj.x - activeForestCenters[c].x,
                                    obj.y - activeForestCenters[c].y,
                                );
                                if (distToCenter < FOREST_CLUSTER_RADIUS)
                                    inActiveForest = true;
                            }
                        }

                        if (tImg && tImg.complete && tImg.naturalHeight !== 0) {
                            const scaledWidth = tImg.width * scale;
                            const scaledHeight = tImg.height * scale;
                            const drawX = obj.x - scaledWidth / 2;
                            const drawY = obj.y - scaledHeight;
                            ctx.save();
                            if (
                                obj.state === "grown" ||
                                obj.state === "grown-new-tree"
                            )
                                ctx.globalAlpha = 0.5 + obj.depthLayer * 0.25;
                            if (inActiveForest) {
                                const pulse =
                                    Math.sin(Date.now() / 200) * 10 + 20;
                                ctx.shadowColor = "#FFD700";
                                ctx.shadowBlur = pulse;
                                ctx.globalCompositeOperation = "source-over";
                            }
                            ctx.drawImage(
                                tImg,
                                drawX,
                                drawY,
                                scaledWidth,
                                scaledHeight,
                            );
                            ctx.restore();
                        } else {
                            if (
                                obj.state === "growing" ||
                                obj.state === "growing-new-tree"
                            ) {
                                ctx.fillStyle = `rgba(100, 255, 100, ${obj.frameIndex / plantCount})`;
                                const size = (20 + obj.frameIndex * 2) * scale;
                                ctx.fillRect(
                                    obj.x - size / 2,
                                    obj.y - size,
                                    size,
                                    size,
                                );
                            } else {
                                ctx.fillStyle = "#228B22";
                                ctx.fillRect(
                                    obj.x - 30 * scale,
                                    obj.y - 80 * scale,
                                    60 * scale,
                                    80 * scale,
                                );
                            }
                        }
                    }
                }
                // ==========================================

                floatingTexts.forEach((ft) => {
                    ctx.save();
                    ctx.font = "bold 16px Arial";
                    ctx.fillStyle = ft.color;
                    ctx.shadowColor = "black";
                    ctx.shadowBlur = 4;
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.restore();
                });

                ctx.restore();

                if (showUI) {
                    drawMiniMap();

                    ctx.fillStyle = "#fff";
                    ctx.font = "16px Courier New";
                    ctx.textAlign = "left";
                    const controls = [
                        "A / D : Move Left/Right",
                        "SPACE (x1) : Jump",
                        "SPACE (x2 - Air) : Float",
                        "SPACE (x3) : Land",
                        "W : Fly Up / Takeoff",
                        "S : Fly Down / Phase Through",
                        "G : Glowing",
                        `P / O : Plant Tree (Cost: ${ENERGY_COST_TO_PLANT} Energy)`,
                        "Forest: Cluster Trees",
                        "SHIFT + A/D : Boost",
                        "Hold SHIFT 3s : Turbo",
                        `B : Build Ground Platform (Cost: ${NEW_GROUND_COST_ETHER} Ether)`,
                        "Scroll : Zoom (" + zoom.toFixed(1) + "x)",
                        "H : Hide UI",
                        "ESC : Menu",
                    ];
                    controls.forEach((text, i) =>
                        ctx.fillText(text, 20, 30 + i * 20),
                    );

                    const stateNames = [
                        "Idle",
                        "Walking",
                        "Jumping",
                        "Glowing",
                        "Floating",
                        "Flying Up",
                        "Flying Down",
                        "BOOST!",
                        "TURBO!",
                        "Landing",
                    ];
                    const stateColors = [
                        "#FFC107",
                        "#4CAF50",
                        "#FF5722",
                        "#FFD700",
                        "#00BFFF",
                        "#E91E63",
                        "#FF6F00",
                        "#FFFF00",
                        "#00FF00",
                        "#9C27B0",
                    ];
                    const stateIdx = [
                        0,
                        character.isMoving,
                        character.isJumping,
                        character.isGlowing,
                        character.isFloating,
                        character.isFlyingUp,
                        character.isFlyingDown,
                        character.isBoost,
                        character.isTurbo,
                        character.isLanding,
                    ].lastIndexOf(true);
                    ctx.fillStyle = stateColors[stateIdx];
                    ctx.fillText("State: " + stateNames[stateIdx], 20, 330);

                    const timeUntilWave = (
                        (AUTO_SPAWN_INTERVAL_MS -
                            (Date.now() - lastAutoSpawnTime)) /
                        1000
                    ).toFixed(0);

                    ctx.fillStyle = "#AAAAAA";
                    ctx.fillText(`Next Wave: ${timeUntilWave}s`, 20, 350);

                    if (activeForestCenters.length > 0) {
                        const timeUntilAurel = (
                            (AUREL_SPAWN_RATE_MS -
                                (Date.now() - lastAurelSpawnTime)) /
                            1000
                        ).toFixed(0);
                        ctx.fillStyle = "#FFD700";
                        ctx.fillText(
                            `Next Forest Aurel: ${timeUntilAurel}s`,
                            20,
                            370,
                        );
                    } else {
                        ctx.fillStyle = "#555";
                        ctx.fillText("Next Forest Aurel: No Forest", 20, 370);
                    }

                    if (activeForestCenters.length > 0) {
                        ctx.fillStyle = "#FFD700";
                        ctx.fillText(
                            `FORESTS ACTIVE: ${activeForestCenters.length}`,
                            20,
                            390,
                        );
                    } else {
                        ctx.fillStyle = "#555";
                        ctx.fillText(
                            "Forest: Inactive (Need cluster)",
                            20,
                            390,
                        );
                    }

                    const foundCount = stars.filter((s) => s.found).length;
                    ctx.fillStyle = "#FFD700";
                    ctx.shadowColor = "#FFD700";
                    ctx.shadowBlur = 10;
                    ctx.fillText(
                        `GOLDEN STARS: ${foundCount} / ${STAR_COUNT}`,
                        20,
                        410,
                    );
                    ctx.shadowBlur = 0;

                    if (character.isBoost) {
                        const remaining = (
                            (character.boostDuration -
                                (Date.now() - character.boostStartTime)) /
                            1000
                        ).toFixed(1);
                        ctx.fillStyle = "#FFFF00";
                        ctx.fillText(`Turbo in: ${remaining}s`, 20, 430);
                    }

                    ctx.fillStyle = "#888";
                    ctx.fillText(
                        `World Objects (Trees): ${worldObjects.length}`,
                        20,
                        450,
                    );
                    ctx.fillStyle = "#00FFFF";
                    ctx.shadowColor = "#00FFFF";
                    ctx.shadowBlur = 10;
                    ctx.fillText(
                        `Energy: ${collectedEnergy} / ${ENERGY_COST_TO_PLANT}`,
                        20,
                        470,
                    );

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#FFD700";
                    ctx.shadowColor = "#FFD700";
                    ctx.shadowBlur = 10;
                    ctx.fillText(`Aurels: ${collectedAurels}`, 20, 490);

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#9D00FF";
                    ctx.shadowColor = "#9D00FF";
                    ctx.shadowBlur = 10;
                    ctx.fillText(`Ether: ${collectedEther}`, 20, 510);

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#555";
                    ctx.font = "12px Courier New";
                    ctx.fillText(
                        `Geometric Cores: ${geometricCores.length}`,
                        20,
                        530,
                    );
                    ctx.fillText(
                        `Position: X=${Math.round(character.x)}, Y=${Math.round(character.y)}`,
                        20,
                        550,
                    );
                } else {
                    ctx.fillStyle = "#888";
                    ctx.font = "14px Courier New";
                    ctx.textAlign = "left";
                    ctx.fillText("Press H to show controls", 20, 30);
                }
            }

            function gameLoop() {
                try {
                    update();
                    draw();
                } catch (e) {
                    console.error("Game Loop Error:", e);
                }
                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        </script>
    </body>
</html>
